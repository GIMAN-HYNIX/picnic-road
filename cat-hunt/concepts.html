<title>고양이 사냥 컨셉 10</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* 컨셉 비교 갤러리. 따뜻한 종이 바탕에 카드마다 자기 팔레트를 쓰도록 중립 톤으로 둠 */
:root{
  --bg:#f4efe6; --card:#fffdf8; --ink:#2b2420; --soft:#6f655b; --line:#e3dacb; --accent:#c8553d; --chip:#efe6d6;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; --f-head:'Jua','Gowun Dodum',system-ui,sans-serif;
}
:root{color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1814;--card:#262019;--ink:#f1e9dc;--soft:#b3a794;--line:#3a3128;--accent:#f08a6c;--chip:#332b22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1814;--card:#262019;--ink:#f1e9dc;--soft:#b3a794;--line:#3a3128;--accent:#f08a6c;--chip:#332b22;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-family:var(--f-head);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:1.15;margin:0 0 8px;text-wrap:balance}
.lead{margin:0 0 6px;color:var(--soft);max-width:44em}
.how{display:flex;flex-wrap:wrap;gap:8px 16px;margin:18px 0 26px;padding:12px 16px;background:var(--chip);border-radius:12px;font-size:14px;color:var(--soft)}
.how b{color:var(--ink);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card svg.scene{display:block;width:100%;height:auto;aspect-ratio:360/260}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.name{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.no{font-family:var(--f-head);font-size:15px;color:#fff;background:var(--accent);border-radius:999px;padding:1px 10px 0}
.name h2{font-family:var(--f-head);font-weight:400;font-size:24px;margin:0;line-height:1.2}
.pitch{margin:0;font-size:15px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
dt{color:var(--soft);white-space:nowrap}
dd{margin:0;min-width:0}
.pal{display:flex;gap:6px;align-items:center;margin-top:2px}
.pal i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:block}
.pal span{font-size:12px;color:var(--soft);margin-left:4px}
.end{margin-top:34px;padding:20px 22px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.end h3{font-family:var(--f-head);font-weight:400;font-size:24px;margin:0 0 8px}
.end p{margin:0 0 8px;max-width:50em}
</style>

<div class="wrap">
  <h1>고양이와 함께 사냥 · 컨셉 10가지</h1>
  <p class="lead">주인공과 고양이가 한 팀이 되어 사냥하고, 수확하고, 쉬는 탑뷰 게임이에요. 세계관, 주인공, 고양이 모습을 10가지 방향으로 그려 봤어요. 마음에 드는 번호를 알려주세요. 섞어도 좋아요.</p>
  <div class="how"><span><b>공통</b> 고양이는 명령 없이 알아서 도와요 (냥냥펀치, 할퀴기)</span><span><b>공통</b> 쓰러진 적 위에서 꾹꾹이 → 식빵 굽기 → 빵으로 수확</span><span><b>공통</b> 사냥 뒤 모닥불 곁에서 쓰다듬고 간식 먹기</span></div>
  <div class="grid" id="grid"></div>
  <section class="end" id="end"></section>
</div>

<script>
/* ================= 그림 도구 ================= */
const O = '#3a2a25';                       // 부드러운 갈색 외곽선
const st = (w = 3) => `stroke="${O}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const uid = (() => { let n = 0; return p => p + (++n); })();

/* ----- 고양이 (원점: 발 가운데, 위가 -y) ----- */
function cat(c, o = {}) {
  const f = c.fur, d = c.furDark, w = c.belly || '#fffaf0', e = c.eye || '#e8b23a', head = o.head;
  const pat = c.pattern;
  let s = '';
  if (!head) {
    s += `<path d="M20 -14 Q52 -12 46 -44 Q44 -54 34 -50" fill="none" stroke="${O}" stroke-width="12" stroke-linecap="round"/><path d="M20 -14 Q52 -12 46 -44 Q44 -54 34 -50" fill="none" stroke="${f}" stroke-width="7" stroke-linecap="round"/>`;
    if (c.tailTip) s += `<path d="M44 -42 Q44 -54 34 -50" fill="none" stroke="${c.tailTip}" stroke-width="7" stroke-linecap="round"/>`;
    s += `<ellipse cx="0" cy="-20" rx="24" ry="19" fill="${f}" ${st()}/>`;
    s += `<ellipse cx="0" cy="-16" rx="14" ry="12" fill="${w}"/>`;
    if (pat === 'stripes') for (const x of [-14, -6, 4, 12]) s += `<path d="M${x} -36 q2 5 0 11" stroke="${d}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    if (pat === 'patches') s += `<path d="M-22 -26 q8 -12 18 -8 q2 10 -10 14z" fill="${c.patch1}"/><path d="M8 -36 q12 -2 16 8 q-8 6 -16 -2z" fill="${c.patch2}"/>`;
    if (pat === 'points') s += `<ellipse cx="0" cy="-22" rx="22" ry="16" fill="${f}" opacity=".0"/>`;
    s += `<ellipse cx="-10" cy="-4" rx="8" ry="5.4" fill="${w}" ${st(2.4)}/><ellipse cx="10" cy="-4" rx="8" ry="5.4" fill="${w}" ${st(2.4)}/>`;
  }
  const hy = head ? -10 : -46;
  s += `<path d="M-17 ${hy - 8} L-16 ${hy - 31} L-3 ${hy - 15}Z" fill="${f}" ${st()}/><path d="M17 ${hy - 8} L16 ${hy - 31} L3 ${hy - 15}Z" fill="${f}" ${st()}/>`;
  s += `<path d="M-14 ${hy - 14} L-13.6 ${hy - 25} L-7 ${hy - 17}Z" fill="${c.ear || '#f4a6a6'}"/><path d="M14 ${hy - 14} L13.6 ${hy - 25} L7 ${hy - 17}Z" fill="${c.ear || '#f4a6a6'}"/>`;
  s += `<ellipse cx="0" cy="${hy}" rx="21" ry="18.5" fill="${f}" ${st()}/>`;
  s += `<ellipse cx="0" cy="${hy + 6}" rx="12" ry="9" fill="${w}"/>`;
  if (pat === 'stripes') for (const x of [-6, 0, 6]) s += `<path d="M${x} ${hy - 17} v6" stroke="${d}" stroke-width="2.6" stroke-linecap="round"/>`;
  if (pat === 'points') s += `<ellipse cx="0" cy="${hy + 4}" rx="10" ry="9" fill="${d}" opacity=".85"/>`;
  if (pat === 'patches') s += `<path d="M-21 ${hy - 6} q4 -14 16 -12 q-2 10 -16 12z" fill="${c.patch1}"/>`;
  if (pat === 'tux') s += `<path d="M0 ${hy - 8} q-6 10 -3 20 q3 2 6 0 q3 -10 -3 -20z" fill="${w}"/>`;
  for (const sx of [-1, 1]) {
    s += `<ellipse cx="${sx * 9}" cy="${hy - 1}" rx="4.2" ry="5.2" fill="${e}" stroke="${O}" stroke-width="1.6"/><ellipse cx="${sx * 9}" cy="${hy - .4}" rx="2" ry="4" fill="#1d120c"/><circle cx="${sx * 9 - 1.2}" cy="${hy - 3}" r="1.5" fill="#fff"/>`;
    s += `<path d="M${sx * 13} ${hy + 6} l${sx * 11} -2 M${sx * 13} ${hy + 9} l${sx * 11} 2" stroke="${O}" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>`;
    s += `<circle cx="${sx * 15}" cy="${hy + 6}" r="3.6" fill="#f08a8a" opacity=".45"/>`;
  }
  s += `<path d="M-3 ${hy + 5} h6 l-3 3.6z" fill="#e0707a"/><path d="M0 ${hy + 8.6} q-3 3.6 -6 1.4 M0 ${hy + 8.6} q3 3.6 6 1.4" fill="none" stroke="${O}" stroke-width="1.6" stroke-linecap="round"/>`;
  if (c.collar) s += `<path d="M-13 ${hy + 14} q13 8 26 0" fill="none" stroke="${c.collar}" stroke-width="4" stroke-linecap="round"/>${c.bell ? `<circle cx="0" cy="${hy + 19}" r="4" fill="#f4c542" ${st(1.6)}/>` : ''}`;
  if (c.wings && !head) s += `<path d="M-18 -26 q-20 -14 -26 -2 q8 2 8 8 q6 -2 8 4 q8 -2 10 -10z" fill="#fff" ${st(2.4)}/><path d="M18 -26 q20 -14 26 -2 q-8 2 -8 8 q-6 -2 -8 4 q-8 -2 -10 -10z" fill="#fff" ${st(2.4)}/>`;
  if (c.hat) s += c.hat(hy);
  return s;
}
/* ----- 주인공 (원점: 발 가운데) ----- */
function hero(c, o = {}) {
  const sk = c.skin || '#f6cdb0', hair = c.hair, top = c.top, bot = c.bottom, boots = c.boots || '#5a3a2a';
  let s = '';
  if (c.cape) s += c.cape;
  if (c.backpack) s += c.backpack;
  // 머리카락 뒤
  const hs = c.hairStyle;
  if (hs === 'bob') s += `<path d="M-38 -94 Q-42 -144 0 -146 Q42 -144 38 -94 L38 -72 Q0 -64 -38 -72z" fill="${hair}" ${st()}/>`;
  if (hs === 'braid') s += `<path d="M-30 -80 Q-46 -50 -34 -24" fill="none" stroke="${O}" stroke-width="16" stroke-linecap="round"/><path d="M-30 -80 Q-46 -50 -34 -24" fill="none" stroke="${hair}" stroke-width="11" stroke-linecap="round"/><path d="M-37 -92 Q-40 -140 0 -142 Q40 -140 37 -92 L30 -78 Q0 -70 -30 -78z" fill="${hair}" ${st()}/>`;
  if (hs === 'buns') s += `<circle cx="-32" cy="-136" r="14" fill="${hair}" ${st()}/><circle cx="32" cy="-136" r="14" fill="${hair}" ${st()}/><path d="M-37 -92 Q-40 -142 0 -144 Q40 -142 37 -92 L34 -78 Q0 -70 -34 -78z" fill="${hair}" ${st()}/>`;
  if (hs === 'pony') s += `<path d="M26 -124 Q64 -126 52 -80 Q48 -66 38 -72 Q44 -96 28 -108z" fill="${hair}" ${st()}/><path d="M-37 -92 Q-40 -142 0 -144 Q40 -142 37 -92 L30 -78 Q0 -70 -30 -78z" fill="${hair}" ${st()}/>`;
  if (hs === 'short') s += `<path d="M-36 -96 Q-40 -142 0 -144 Q40 -142 36 -96 L34 -82 Q0 -78 -34 -82z" fill="${hair}" ${st()}/>`;
  if (hs === 'dangi') s += `<path d="M-30 -80 Q-44 -46 -32 -14" fill="none" stroke="${O}" stroke-width="16" stroke-linecap="round"/><path d="M-30 -80 Q-44 -46 -32 -14" fill="none" stroke="${hair}" stroke-width="11" stroke-linecap="round"/><path d="M-36 -22 l-8 20 M-30 -18 l-2 20" stroke="#d9433b" stroke-width="5" stroke-linecap="round"/><path d="M-37 -92 Q-40 -142 0 -144 Q40 -142 37 -92 L30 -78 Q0 -70 -30 -78z" fill="${hair}" ${st()}/>`;
  // 다리와 신발
  if (c.outfit !== 'chima' && c.outfit !== 'robe') {
    s += `<rect x="-16" y="-34" width="12" height="28" rx="5.5" fill="${bot}" ${st()}/><rect x="4" y="-34" width="12" height="28" rx="5.5" fill="${bot}" ${st()}/>`;
    s += `<ellipse cx="-10" cy="-5" rx="10.5" ry="6.6" fill="${boots}" ${st()}/><ellipse cx="10" cy="-5" rx="10.5" ry="6.6" fill="${boots}" ${st()}/>`;
  } else {
    s += `<ellipse cx="-10" cy="-4" rx="9" ry="5.4" fill="#fff" ${st(2.4)}/><ellipse cx="10" cy="-4" rx="9" ry="5.4" fill="#fff" ${st(2.4)}/>`;
  }
  // 몸
  if (c.outfit === 'chima') {
    s += `<path d="M-20 -62 Q-34 -36 -38 -12 Q0 -2 38 -12 Q34 -36 20 -62z" fill="${bot}" ${st()}/><path d="M-12 -56 q-4 22 -8 42 M0 -56 v46 M12 -56 q4 22 8 42" stroke="${c.skirtLine || 'rgba(255,255,255,.35)'}" stroke-width="2.4" fill="none"/>`;
    s += `<path d="M-22 -80 Q-24 -62 -20 -58 L20 -58 Q24 -62 22 -80 Q0 -86 -22 -80z" fill="${top}" ${st()}/><path d="M-4 -82 l-4 24 M4 -82 l10 24" stroke="${c.accent}" stroke-width="3.6" fill="none" stroke-linecap="round"/>`;
  } else if (c.outfit === 'robe') {
    s += `<path d="M-22 -80 Q-30 -40 -34 -10 Q0 -2 34 -10 Q30 -40 22 -80 Q0 -88 -22 -80z" fill="${top}" ${st()}/><path d="M-4 -80 L-8 -12" stroke="${c.accent}" stroke-width="3" fill="none"/><path d="M-24 -60 q24 10 48 0" stroke="${c.accent}" stroke-width="5" fill="none"/>`;
  } else if (c.outfit === 'overalls') {
    s += `<path d="M-22 -80 Q-26 -50 -22 -34 L22 -34 Q26 -50 22 -80 Q0 -86 -22 -80z" fill="${c.shirt}" ${st()}/><path d="M-20 -58 L20 -58 L22 -34 L-22 -34z" fill="${top}" ${st()}/><path d="M-14 -58 L-12 -80 M14 -58 L12 -80" stroke="${O}" stroke-width="3"/><path d="M-14 -58 L-12 -78 M14 -58 L12 -78" stroke="${top}" stroke-width="5" stroke-linecap="round"/><circle cx="-13" cy="-62" r="2.4" fill="#f4c542"/><circle cx="13" cy="-62" r="2.4" fill="#f4c542"/>`;
  } else {
    s += `<path d="M-23 -82 Q-30 -56 -26 -34 L26 -34 Q30 -56 23 -82 Q0 -88 -23 -82z" fill="${top}" ${st()}/>`;
    if (c.coatLine) s += `<path d="M0 -84 V-34" stroke="${c.coatLine}" stroke-width="2.4"/><circle cx="6" cy="-62" r="2.4" fill="${c.accent}"/><circle cx="6" cy="-50" r="2.4" fill="${c.accent}"/>`;
  }
  if (c.belt) s += c.belt;
  // 팔 (왼쪽 아래, 오른쪽은 도구)
  s += `<path d="M-21 -76 Q-38 -62 -34 -44" fill="none" stroke="${O}" stroke-width="14" stroke-linecap="round"/><path d="M-21 -76 Q-38 -62 -34 -44" fill="none" stroke="${c.sleeve || top}" stroke-width="9" stroke-linecap="round"/><circle cx="-34" cy="-41" r="6.6" fill="${sk}" ${st(2.4)}/>`;
  if (o.arms) s += cat(o.catColors, { arms: 1 });
  const prop = c.prop || '';
  s += `<path d="M21 -76 Q40 -66 38 -50" fill="none" stroke="${O}" stroke-width="14" stroke-linecap="round"/><path d="M21 -76 Q40 -66 38 -50" fill="none" stroke="${c.sleeve || top}" stroke-width="9" stroke-linecap="round"/>`;
  if (prop) s += `<g transform="translate(40 -46)">${prop}</g>`;
  s += `<circle cx="38" cy="-47" r="6.6" fill="${sk}" ${st(2.4)}/>`;
  if (c.scarf) s += c.scarf;
  // 머리
  s += `<ellipse cx="0" cy="-100" rx="35" ry="33" fill="${sk}" ${st()}/>`;
  // 앞머리
  if (hs === 'bob' || hs === 'braid' || hs === 'buns' || hs === 'pony' || hs === 'dangi') s += `<path d="M-35 -104 Q-31 -138 0 -136 Q31 -138 35 -104 Q24 -120 10 -112 Q-2 -124 -16 -111 Q-28 -112 -35 -104z" fill="${hair}" ${st(2.6)}/>`;
  if (hs === 'short') s += `<path d="M-35 -102 Q-30 -138 0 -137 Q30 -138 35 -102 Q20 -112 6 -108 Q-8 -118 -20 -108 Q-30 -108 -35 -102z" fill="${hair}" ${st(2.6)}/>`;
  for (const sx of [-1, 1]) {
    s += `<ellipse cx="${sx * 13}" cy="-97" rx="3.8" ry="5.2" fill="#2a1814"/><circle cx="${sx * 13 - 1.2}" cy="-99.4" r="1.6" fill="#fff"/><circle cx="${sx * 24}" cy="-88" r="5.6" fill="#f08a78" opacity=".5"/>`;
  }
  s += `<path d="M-4 -87 q4 4 8 0" fill="none" stroke="#7a3a30" stroke-width="2.4" stroke-linecap="round"/>`;
  if (c.head) s += c.head;
  return s;
}
function pair(cfg) {
  const H = cfg.hero, C = cfg.cat, mode = cfg.carry;
  let g = '';
  const hx = mode === 'beside' ? 120 : 150, hy = 228;
  if (cfg.stage) g += cfg.stage(hx, hy);
  g += `<ellipse cx="${hx}" cy="${hy}" rx="38" ry="8" fill="rgba(0,0,0,.18)"/>`;
  if (mode === 'beside') g += `<ellipse cx="240" cy="${hy}" rx="30" ry="6" fill="rgba(0,0,0,.18)"/><g transform="translate(240 ${hy}) scale(1.05)">${cat(C)}</g>`;
  g += `<g transform="translate(${hx} ${hy})">`;
  g += hero(H);
  if (mode === 'bag') {
    const bc = H.bagC || '#b88548';
    g += `<g transform="translate(-52 -66) scale(.92)">${cat(C, { head: 1 })}</g><path d="M-70 -56 Q-52 -66 -34 -56 L-32 -34 Q-52 -26 -72 -34z" fill="${bc}" ${st()}/><path d="M-70 -56 Q-52 -66 -34 -56" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="3" stroke-linecap="round"/><circle cx="-52" cy="-44" r="3.2" fill="#f4c542" ${st(1.6)}/>`;
  }
  if (mode === 'shoulder') g += `<g transform="translate(-47 -62) scale(.66)">${cat(C)}</g>`;
  if (mode === 'arms') g += `<g transform="translate(0 -36) scale(.72)">${cat(C)}</g><circle cx="-34" cy="-41" r="6.6" fill="${H.skin || '#f6cdb0'}" ${st(2.4)}/><circle cx="34" cy="-41" r="6.6" fill="${H.skin || '#f6cdb0'}" ${st(2.4)}/>`;
  if (mode === 'head') g += `<g transform="translate(0 -128) scale(.6) rotate(-4)">${cat(C, { lying: 1 })}</g>`;
  g += `</g>`;
  return g;
}
/* ================= 무대 (배경) ================= */
const sky = (id, a, b) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
const S = {};
S.autumn = id => `<defs>${sky(id, '#cfe0dc', '#f6e0bd')}</defs><rect width="360" height="260" fill="url(#${id})"/><path d="M0 170 Q70 140 140 165 T290 150 T360 165 V260 H0z" fill="#b6c8a8"/><circle cx="292" cy="62" r="24" fill="#fff6dc" opacity=".8"/>
  ${[[34, 160, 1.1], [318, 170, 1], [262, 178, .8]].map(([x, y, k]) => `<g transform="translate(${x} ${y}) scale(${k})"><rect x="-5" y="-20" width="10" height="50" rx="3" fill="#6a4a30"/><circle cx="0" cy="-48" r="30" fill="#e8892b"/><circle cx="-18" cy="-34" r="20" fill="#f2b73a"/><circle cx="18" cy="-36" r="21" fill="#d9532f"/><circle cx="2" cy="-60" r="16" fill="#f7cb55"/></g>`).join('')}
  <rect y="205" width="360" height="60" fill="#8fae63"/><path d="M0 205 Q90 198 180 206 T360 204" fill="none" stroke="#a9c57a" stroke-width="4"/>${Array.from({ length: 26 }, (_, i) => `<ellipse cx="${(i * 47) % 350 + 6}" cy="${215 + (i * 13) % 40}" rx="4" ry="2.2" fill="${['#e8892b', '#f2b73a', '#d9532f'][i % 3]}" transform="rotate(${i * 40} ${(i * 47) % 350 + 6} ${215 + (i * 13) % 40})"/>`).join('')}`;
S.spring = id => `<defs>${sky(id, '#fde6ee', '#fff7ef')}</defs><rect width="360" height="260" fill="url(#${id})"/><path d="M0 150 Q60 118 120 146 T250 138 T360 150 V260H0z" fill="#e5efe0"/>
  ${[[40, 150, 1.15], [310, 156, 1.05]].map(([x, y, k]) => `<g transform="translate(${x} ${y}) scale(${k})"><path d="M0 40 Q-4 0 -14 -26 M-2 8 Q14 -8 26 -22" stroke="#6a4a3a" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="0" cy="-44" r="34" fill="#f9b6ca"/><circle cx="-26" cy="-26" r="24" fill="#fbd0dd"/><circle cx="26" cy="-28" r="25" fill="#f49ab4"/><circle cx="4" cy="-62" r="18" fill="#fde0e8"/></g>`).join('')}
  <rect y="182" width="360" height="30" fill="#d9d2c6"/>${Array.from({ length: 9 }, (_, i) => `<rect x="${i * 42 - 10}" y="184" width="38" height="12" rx="5" fill="#ebe5da" stroke="#bdb5a6" stroke-width="2"/><rect x="${i * 42 + 10}" y="198" width="38" height="12" rx="5" fill="#e3dcd0" stroke="#bdb5a6" stroke-width="2"/>`).join('')}
