<title>아침 숲 산책</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
  /* 화면 전체가 숲. 시작 카드와 작은 표시만 위에 띄움 (어두운 숲 테마 하나로 고정) */
  :root {
    --frame: #0f1712; --card: #f1e9d6; --ink: #2a1c14; --muted: #6a5a48; --accent: #d8833e; --chip: rgba(14, 22, 16, .7); --chip-ink: #f1e9d6;
    --display: 'Black Han Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--frame); color: var(--chip-ink); font-family: var(--body); overflow: hidden; word-break: keep-all; overscroll-behavior: none; }
  #game { position: fixed; left: 0; top: 0; display: block; touch-action: none; cursor: grab; }
  #game:active { cursor: grabbing; }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .hud { position: fixed; z-index: 5; display: flex; gap: 8px; align-items: center; }
  .hud.tl { top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(10px + env(safe-area-inset-left, 0px)); }
  .hud.tr { top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); }
  .chip { background: var(--chip); color: var(--chip-ink); border: 1px solid rgba(241, 233, 214, .16); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; line-height: 1.3; backdrop-filter: blur(3px); }
  .chip b { font-family: var(--display); font-weight: 400; letter-spacing: .02em; }
  button.chip:hover { border-color: rgba(241, 233, 214, .5); }
  .hint { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transition: opacity .8s ease; text-align: center; max-width: calc(100% - 32px); }
  .hint.off { opacity: 0; pointer-events: none; }

  #intro { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(8, 14, 10, .62); padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
  .card { background: var(--card); color: var(--ink); border-radius: 8px; box-shadow: 0 10px 40px rgba(0, 0, 0, .4); display: grid; grid-template-columns: auto minmax(0, 330px); gap: 22px; align-items: center; padding: 20px; max-width: 780px; }
  .card canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 4px; max-width: 100%; }
  .eyebrow { font-size: 13px; letter-spacing: .08em; color: #9a4a1c; margin: 0; }
  .card h1 { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.2; margin: 4px 0 10px; text-wrap: balance; }
  .card p { margin: 0 0 10px; font-size: 15px; line-height: 1.6; }
  .keys { font-size: 13.5px; color: var(--muted); margin: 0 0 16px; }
  .keys kbd { font-family: inherit; background: #e4dac2; border: 1px solid #cbbd9c; border-bottom-width: 2px; border-radius: 4px; padding: 0 6px; font-size: 12.5px; color: var(--ink); }
  .go { background: var(--ink); color: var(--card); border: 0; border-radius: 6px; padding: 10px 18px; font-size: 16px; font-family: var(--display); letter-spacing: .03em; min-width: 190px; }
  .go:hover { background: #4a2e20; }
  .go[disabled] { opacity: .6; cursor: wait; }
  @media (max-width: 640px) {
    .card { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; gap: 12px; padding: 16px; }
    .card h1 { font-size: 25px; }
  }
</style>

<canvas id="game" aria-label="거대한 나무 숲을 걷는 사냥꾼과 고양이"></canvas>

<div class="hud tl"><span class="chip"><b id="clock">오전 6:40</b> · 아침 숲</span></div>
<div class="hud tr">
  <button class="chip" id="snd" type="button" aria-pressed="true">소리 끄기</button>
  <button class="chip" id="help" type="button">설명</button>
</div>
<div class="hint chip off" id="hint">방향키 · WASD로 걷기 &nbsp;|&nbsp; Shift 살금살금 &nbsp;|&nbsp; 휴대폰은 화면을 끌어서 이동</div>

<div id="intro" role="dialog" aria-modal="true" aria-labelledby="ttl">
  <div class="card">
    <canvas id="poster" width="160" height="160" aria-label="사냥꾼과 고양이 솔 포스터"></canvas>
    <div>
      <p class="eyebrow">데모 · 아직 적은 없어요</p>
      <h1 id="ttl">무뚝뚝한 사냥꾼과 고양이 솔</h1>
      <p>아름드리나무가 하늘을 가린 아침 숲이에요. 사냥꾼과 솔이 고사리를 헤치고 걸어요. 다람쥐와 청설모는 멀찍이서 눈치를 보고, 나뭇가지와 덤불에서는 새들이 지저귀어요.</p>
      <p class="keys"><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> 또는 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 걷기 · <kbd>Shift</kbd> 살금살금(동물이 덜 놀라요) · 휴대폰은 화면을 끌어서 이동. 가만히 서 있으면 솔이 옆에 앉아 쉬어요.</p>
      <button class="go" id="go" type="button" disabled>숲을 그리는 중…</button>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/hires.js"></script>
<script src="js/editorial.js"></script>
<script src="js/hunter.js"></script>
<script src="js/critters.js"></script>
<script src="js/woods.js"></script>
<script src="js/sfx.js"></script>
<script src="js/woods-game.js"></script>
<script>
(function () {
  const intro = document.getElementById('intro'), go = document.getElementById('go'), hint = document.getElementById('hint');
  const pc = document.getElementById('poster'), pg = pc.getContext('2d');
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  // 시작 카드 그림: 에디토리얼 포스터 (정수배로 키움)
  function fitPoster() { const room = Math.min(innerWidth - 64, innerHeight * .56, 360), k = Math.max(1, Math.min(2, Math.floor(room / 160))); pc.style.width = pc.style.height = (160 * k) + 'px'; }
  addEventListener('resize', fitPoster); fitPoster();
  const frames = [];
  pg.drawImage(posterFrame(0).canvas(), 0, 0);
  setTimeout(() => {
    for (let f = 0; f < 16; f++) frames.push(posterFrame(f).canvas());
    let pf = 0; setInterval(() => { if (intro.hidden || reduce) return; pf = (pf + 1) % 16; pg.drawImage(frames[pf], 0, 0); }, 125);
    WG.init(document.getElementById('game'), (p, msg) => { go.textContent = `${msg}… ${Math.round(p * 100)}%`; }).then(() => {
      go.disabled = false; go.textContent = '숲으로 들어가기'; go.focus();
    });
  }, 30);
  let hintT = 0;
  function enter() { if (go.disabled) return; intro.hidden = true; WG.start(); hint.classList.remove('off'); clearTimeout(hintT); hintT = setTimeout(() => hint.classList.add('off'), 7000); document.getElementById('game').focus?.(); }
  go.addEventListener('click', enter);
  document.getElementById('help').addEventListener('click', () => { intro.hidden = false; go.textContent = '다시 걷기'; go.focus(); });
  addEventListener('keydown', e => { if (!intro.hidden && !go.disabled && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); enter(); } else if (!intro.hidden && e.key === 'Escape' && !go.disabled) enter(); });
  const snd = document.getElementById('snd');
  snd.addEventListener('click', () => { SFX.init(); const on = SFX.toggle(); snd.textContent = on ? '소리 끄기' : '소리 켜기'; snd.setAttribute('aria-pressed', on ? 'true' : 'false'); });
  const clock = document.getElementById('clock'); setInterval(() => { clock.textContent = WG.clock(); }, 1000);
})();
</script>
