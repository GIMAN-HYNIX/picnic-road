<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>쪈이의 디저트 대작전</title>
<meta name="theme-color" content="#FFE1EA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="디저트 대작전">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:'Jua'; src:url(fonts/jua.woff2) format('woff2'); font-display:swap}
@font-face{font-family:'Gowun Dodum'; src:url(fonts/gowun-dodum.woff2) format('woff2'); font-display:swap}
/* One look on purpose: a pastry-shop world. Strawberry-milk ground, cream paper cards, plum ink, one hot pink for what you press. */
:root{
  --bg:#FFE1EA; --paper:#FFF9F0; --paper-2:#FFF1DC; --ink:#4A2040; --ink-2:#8A5F7C;
  --line:rgba(74,32,64,.16); --line-2:rgba(74,32,64,.32);
  --accent:#FF4F86; --on-accent:#FFFFFF; --gold:#E9A400; --good:#2FAE7A; --bad:#E0445A;
  --font-sign:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-ui:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --m150:150ms; --m200:200ms; --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
html{touch-action:manipulation; -webkit-text-size-adjust:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-size:16px; line-height:1.5; word-break:keep-all; overflow:hidden; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
[hidden]{display:none!important}
button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
svg{display:block; width:100%; height:100%}
.screen{position:fixed; inset:0; display:flex; flex-direction:column; padding:calc(12px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-right,0px)); animation:fade var(--m200) var(--ease)}
.col{width:100%; max-width:460px; margin:0 auto; flex:1; min-height:0; display:flex; flex-direction:column; gap:10px}
@keyframes fade{from{opacity:0}}

/* title */
#title .col{justify-content:center; text-align:center; gap:12px}
.t-art{position:relative; height:min(300px, 36vh); flex:none}
.t-art img{position:absolute; bottom:0}
.t-art .h{left:50%; height:78%; transform:translateX(-50%); z-index:2}
.t-art .b{left:50%; height:100%; transform:translateX(-50%); opacity:.28}
.t-art .e1{left:2%; height:34%} .t-art .e2{right:2%; height:34%}
.wordmark{margin:0; font-family:var(--font-sign); font-weight:400; font-size:2.5rem; line-height:1.1}
.sub{margin:0; font-size:.875rem; color:var(--ink-2); text-wrap:balance}
.stack{display:flex; flex-direction:column; gap:8px}
.cta{min-height:54px; padding:0 18px; border:0; border-radius:16px; background:var(--accent); color:var(--on-accent); font-family:var(--font-sign); font-size:1.25rem; box-shadow:0 4px 0 #C92E63}
.cta:active{transform:translateY(3px); box-shadow:0 1px 0 #C92E63}
.btn{min-height:48px; padding:0 14px; border-radius:14px; background:var(--paper); border:1.5px solid var(--line-2); font-size:.9375rem}
.btn:active{background:var(--paper-2)}
.btn[aria-disabled="true"]{opacity:.45}

/* run bar */
.bar{display:flex; align-items:center; justify-content:space-between; gap:10px; font-family:var(--font-sign); font-size:1.0625rem; font-variant-numeric:tabular-nums}
.bar .l, .bar .r{display:flex; align-items:center; gap:12px}
.chip{display:flex; align-items:center; gap:5px}
.chip i{display:block; width:20px; height:20px}
.mini-btn{min-height:44px; padding:0 12px; border-radius:12px; background:var(--paper); border:1.5px solid var(--line-2); font-family:var(--font-ui); font-size:.875rem}
.relics{display:flex; gap:6px; flex-wrap:wrap; min-height:34px}
.relic{width:34px; height:34px; padding:5px; border-radius:10px; background:var(--paper); border:1.5px solid var(--line)}

/* map */
.map{position:relative; flex:1; min-height:0; background:var(--paper); border:1.5px solid var(--line); border-radius:22px; overflow:hidden}
.map-in{position:absolute; inset:46px 0 40px}
.roads{position:absolute; inset:0; overflow:visible}
.roads line{stroke:var(--line-2); stroke-width:2; stroke-dasharray:5 6; vector-effect:non-scaling-stroke}
.roads line.walked{stroke:var(--ink); stroke-dasharray:none}
.node{position:absolute; width:50px; height:50px; padding:7px; transform:translate(-50%,-50%); border-radius:50%; background:var(--paper); border:2px solid var(--line-2)}
.node img{display:block; width:100%; height:100%; object-fit:contain}
.node.boss{width:76px; height:76px; padding:6px}
.node.open{border:3px solid var(--accent); padding:6px}
.node.done{opacity:.45}
.node.here{opacity:1; border-color:var(--ink)}
.node.sel{outline:3px solid var(--ink); outline-offset:2px}
.info{min-height:104px; padding:12px 14px; background:var(--paper); border:1.5px solid var(--line); border-radius:18px; display:flex; gap:12px; align-items:center}
.info div{flex:1; min-width:0}
.info h3{margin:0; font-family:var(--font-sign); font-weight:400; font-size:1.125rem; line-height:1.25}
.info p{margin:2px 0 0; font-size:.875rem; color:var(--ink-2)}
.info .cta{min-height:48px; font-size:1.0625rem; flex:none}

/* battle */
#battle{padding:0}
#cv{position:absolute; inset:0; width:100%; height:100%; touch-action:none}
.hud{position:absolute; left:0; right:0; top:0; padding:calc(8px + env(safe-area-inset-top,0px)) 12px 0; display:flex; flex-direction:column; gap:6px; pointer-events:none}
.hud-row{display:flex; align-items:center; gap:10px}
.timer{font-family:var(--font-sign); font-size:1.5rem; font-variant-numeric:tabular-nums; min-width:3.2em; text-shadow:0 2px 0 var(--paper)}
.meter{flex:1; height:16px; border-radius:8px; background:rgba(74,32,64,.18); overflow:hidden; border:1.5px solid var(--ink)}
.meter i{display:block; height:100%; width:100%; transform-origin:left; background:var(--bad)}
.meter.xp{height:9px; border-width:1px} .meter.xp i{background:#59B8FF}
.lv{font-family:var(--font-sign); font-size:.9375rem; min-width:3em; text-shadow:0 1px 0 var(--paper)}
.pause{pointer-events:auto; width:44px; height:44px; border-radius:12px; background:var(--paper); border:1.5px solid var(--ink); font-family:var(--font-sign)}
.potion{width:26px; height:26px}
.hearts{display:flex; gap:3px} .hearts i{display:block; width:26px; height:26px; filter:drop-shadow(0 1.5px 0 rgba(74,32,64,.35))}
.hearts i.broke{animation:heartBreak .5s cubic-bezier(.2,.8,.3,1)}
.hearts.shake{animation:hudShake .35s}
.hud-gap{flex:1}
.chip i.hrt{width:18px; height:18px} .chip i.hrt.off{opacity:.7}
@keyframes heartBreak{0%{transform:scale(1.7) rotate(-12deg)}40%{transform:scale(.8) rotate(8deg)}100%{transform:scale(1)}}
@keyframes hudShake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@media (prefers-reduced-motion: reduce){.hearts i.broke,.hearts.shake{animation:none}}
.bossbar{margin-top:2px} .bossbar .meter i{background:#9B59D0}
.bossname{font-family:var(--font-sign); font-size:.875rem; text-shadow:0 1px 0 var(--paper)}
.toast{position:absolute; left:0; right:0; top:26%; text-align:center; font-family:var(--font-sign); font-size:1.5rem; text-shadow:0 2px 0 var(--paper); pointer-events:none}

/* sheets */
.overlay{position:fixed; inset:0; z-index:20; background:rgba(74,32,64,.5); display:grid; place-items:center; padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.card{width:min(100%, 380px); max-height:100%; overflow:auto; background:var(--paper); border:2px solid var(--ink); border-radius:22px; padding:20px 16px 16px; animation:pop var(--m200) var(--ease)}
@keyframes pop{from{opacity:0; transform:translateY(8px)}}
.card h2{margin:0; font-family:var(--font-sign); font-weight:400; font-size:1.625rem; line-height:1.2; text-wrap:balance}
.card p{margin:6px 0 0; color:var(--ink-2); font-size:.9375rem}
.card .pic{height:110px; margin:0 auto 6px; display:flex; justify-content:center}
.card .pic img{height:100%}
.opts{display:flex; flex-direction:column; gap:8px; margin-top:14px}
.opt{display:flex; align-items:center; gap:12px; width:100%; min-height:64px; padding:9px 12px; text-align:left; border-radius:16px; background:#FFFFFF; border:1.5px solid var(--line-2)}
.opt:active{background:var(--paper-2)}
.opt.on{border:2.5px solid var(--accent); padding:8px 11px}
.opt[aria-disabled="true"]{opacity:.45}
.opt .ic{flex:none; width:46px; height:46px; padding:5px; border-radius:12px; background:var(--paper-2)}
.opt.r1 .ic{background:#DDF0FF} .opt.r2 .ic{background:#FFE7A8}
.opt .tx{flex:1; min-width:0}
.opt b{display:block; font-family:var(--font-sign); font-weight:400; font-size:1rem; line-height:1.3}
.opt span{display:block; font-size:.875rem; line-height:1.4; color:var(--ink-2)}
.opt em{flex:none; font-style:normal; font-family:var(--font-sign); font-size:.9375rem; color:var(--gold)}
.card .cta, .card .btn{width:100%; margin-top:12px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
@media (prefers-reduced-motion: reduce){ .screen, .card{animation:none} }
</style>
</head>
<body>
<section class="screen" id="title">
  <div class="col">
    <div class="t-art" aria-hidden="true"><img class="b" src="img/boss.png" alt=""><img class="e1" src="img/jelly.png" alt=""><img class="e2" src="img/cookie.png" alt=""><img class="h" src="img/hero.png" alt=""></div>
    <h1 class="wordmark">쪈이의<br>디저트 대작전</h1>
    <p class="sub" id="titleSub"></p>
    <div class="stack">
      <button class="cta" id="btnContinue" type="button">이어서 하기</button>
      <button class="cta" id="btnNew" type="button">모험 떠나기</button>
      <button class="btn" id="btnInstall" type="button" hidden>홈 화면에 앱으로 설치하기</button>
      <button class="btn" id="btnSet" type="button">소리와 진동 바꾸기</button>
    </div>
  </div>
</section>

<section class="screen" id="map" hidden>
  <div class="col">
    <div class="bar"><div class="l"><span class="chip" id="hpChip"></span><span class="chip" id="goldChip"></span><span class="chip" id="potChip"></span></div><div class="r"><button class="mini-btn" id="btnDeck" type="button">덱 보기</button><button class="mini-btn" id="btnMenu" type="button">메뉴</button></div></div>
    <div class="relics" id="relics"></div>
    <div class="map" id="mapBox"></div>
    <div class="info" id="info"></div>
  </div>
</section>

<section class="screen" id="battle" hidden>
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="hud-row"><span class="timer" id="timer">2:00</span><div class="hearts" id="hearts" aria-label="하트"></div><span class="hud-gap"></span><span class="potion" id="potHud"></span><button class="pause" id="btnPause" type="button" aria-label="일시정지">II</button></div>
    <div class="hud-row"><span class="lv" id="lvText">Lv 1</span><div class="meter xp"><i id="xpBar"></i></div></div>
    <div class="bossbar" id="bossBar" hidden><span class="bossname" id="bossName"></span><div class="meter"><i id="bossHp"></i></div></div>
  </div>
  <div class="toast" id="toast" hidden></div>
</section>

<div class="overlay" id="overlay" hidden><div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle"></div></div>
<script src="game.js"></script>
</body>
</html>
