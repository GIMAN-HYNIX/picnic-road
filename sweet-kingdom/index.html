<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>쪈이의 디저트 대작전</title>
<meta name="theme-color" content="#F6C983">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="디저트 대작전">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:'Jua'; src:url(fonts/jua.woff2) format('woff2'); font-display:swap}
@font-face{font-family:'Gowun Dodum'; src:url(fonts/gowun-dodum.woff2) format('woff2'); font-display:swap}
/* 쿠키런 킹덤 느낌: 따뜻한 비스킷 판, 두꺼운 초콜릿색 테두리, 눌리는 입체 버튼, 테두리 두른 굵은 글자 */
:root{
  --choco:#5A2E14; --choco-d:#3B1C0A; --biscuit:#F3C47A; --biscuit-d:#D99A4E;
  --cream:#FFF7E4; --cream-2:#FCE6BC; --ink:#4A2412; --ink-2:#86573A;
  --accent:#FF5C8A; --gold:#C77A00; --good:#4FA82A; --bad:#E0445A;
  --ol:-2px -2px 0 var(--choco),2px -2px 0 var(--choco),-2px 2px 0 var(--choco),2px 2px 0 var(--choco),0 -2px 0 var(--choco),0 2px 0 var(--choco),-2px 0 0 var(--choco),2px 0 0 var(--choco);
  --font-sign:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-ui:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --m150:150ms; --m200:200ms; --ease:cubic-bezier(.16,1,.3,1); --bounce:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
html{touch-action:manipulation; -webkit-text-size-adjust:100%}
body{background:#F6C983 url(img/bg.jpg) center/cover no-repeat fixed; color:var(--ink); font-family:var(--font-ui); font-size:16px; line-height:1.5; word-break:keep-all; overflow:hidden; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
[hidden]{display:none!important}
button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid #FFF; outline-offset:2px; box-shadow:0 0 0 6px var(--choco)}
svg{display:block; width:100%; height:100%}
.screen{position:fixed; inset:0; display:flex; flex-direction:column; padding:calc(12px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-right,0px)); animation:fade var(--m200) var(--ease)}
.col{width:100%; max-width:460px; margin:0 auto; flex:1; min-height:0; display:flex; flex-direction:column; gap:10px}
@keyframes fade{from{opacity:0}}

/* 공통: 비스킷 판 */
.panel,.card,.info,.map{background:linear-gradient(180deg,var(--cream) 0%,var(--cream-2) 100%); border:3.5px solid var(--choco); border-radius:22px; box-shadow:inset 0 0 0 3px #FFFDF6, inset 0 -6px 0 rgba(200,130,50,.22), 0 6px 0 var(--choco-d), 0 12px 22px rgba(59,28,10,.35)}

/* 버튼: 눌리는 젤리 */
.cta,.btn,.mini-btn,.pause{position:relative; border:3px solid var(--choco); font-family:var(--font-sign); transition:transform 80ms, box-shadow 80ms}
.cta{min-height:58px; padding:0 20px; border-radius:18px; color:var(--choco); font-size:1.375rem; text-shadow:0 1.5px 0 rgba(255,255,255,.7);
  background:linear-gradient(180deg,#FFF09A 0%,#FFD23F 45%,#F7A21B 100%);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.75), inset 0 -5px 0 rgba(190,95,0,.35), 0 5px 0 var(--choco), 0 9px 14px rgba(59,28,10,.3)}
.cta::after,.btn::after{content:''; position:absolute; left:10px; right:10px; top:5px; height:34%; border-radius:12px 12px 40% 40%; background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0)); pointer-events:none}
.cta:active,.btn:active,.mini-btn:active,.pause:active{transform:translateY(4px); box-shadow:inset 0 3px 0 rgba(255,255,255,.6), 0 1px 0 var(--choco)}
.cta.green{color:#FFF; text-shadow:var(--ol), 0 3px 0 var(--choco); background:linear-gradient(180deg,#C8F27A 0%,#86D44A 45%,#4FA82A 100%); box-shadow:inset 0 3px 0 rgba(255,255,255,.6), inset 0 -5px 0 rgba(30,90,10,.35), 0 5px 0 var(--choco), 0 9px 14px rgba(59,28,10,.3)}
.btn{min-height:50px; padding:0 14px; border-radius:16px; font-size:1.0625rem; color:var(--ink); background:linear-gradient(180deg,#FFFDF5,#F6DFAF); box-shadow:inset 0 -4px 0 rgba(190,120,40,.25), 0 4px 0 var(--choco)}
.btn[aria-disabled="true"],.cta[aria-disabled="true"]{filter:grayscale(.8); opacity:.6}

/* 제목 화면 */
#title{background:linear-gradient(180deg,rgba(255,240,210,0) 40%,rgba(90,46,20,.45) 100%)}
#title .col{justify-content:flex-end; text-align:center; gap:12px}
.t-art{position:relative; height:min(300px, 36vh); flex:none}
.t-art img{position:absolute; bottom:0; filter:drop-shadow(0 6px 0 rgba(59,28,10,.25))}
.t-art .h{left:50%; height:84%; transform:translateX(-50%); z-index:2; animation:bob 2.4s ease-in-out infinite}
.t-art .b{left:50%; height:100%; transform:translateX(-50%); opacity:0}
.t-art .e1{left:2%; height:34%; animation:bob 2s ease-in-out .3s infinite} .t-art .e2{right:2%; height:34%; animation:bob 2.2s ease-in-out .8s infinite}
@keyframes bob{50%{translate:0 -8px}}
.wordmark{margin:0; font-family:var(--font-sign); font-weight:400; font-size:2.875rem; line-height:1.08; color:#FFE45C; text-shadow:-3px -3px 0 var(--choco),3px -3px 0 var(--choco),-3px 3px 0 var(--choco),3px 3px 0 var(--choco),0 -3px 0 var(--choco),0 3px 0 var(--choco),-3px 0 0 var(--choco),3px 0 0 var(--choco),0 7px 0 var(--choco-d),0 10px 16px rgba(0,0,0,.3); transform:rotate(-3deg)}
.wordmark .s{display:block; font-size:.62em; color:#FFF; margin-bottom:2px}
.sub{margin:0 auto; max-width:30em; padding:6px 14px; border-radius:999px; background:rgba(59,28,10,.62); color:#FFF4DC; font-size:.875rem; text-wrap:balance}
.stack{display:flex; flex-direction:column; gap:10px; padding-bottom:6px}

/* 위쪽 자원 표시 */
.bar{display:flex; align-items:center; justify-content:space-between; gap:8px; font-family:var(--font-sign); font-size:1.0625rem; font-variant-numeric:tabular-nums}
.bar .l,.bar .r{display:flex; align-items:center; gap:8px}
.chip{display:flex; align-items:center; gap:4px; min-height:34px; padding:2px 11px 2px 5px; border-radius:999px; color:#FFF6E0; text-shadow:0 1.5px 0 var(--choco-d); background:linear-gradient(180deg,#80492A,#5A2E14); border:2.5px solid var(--choco-d); box-shadow:inset 0 2px 0 rgba(255,255,255,.18), 0 3px 0 rgba(59,28,10,.35)}
.chip:empty{display:none}
.chip i{display:block; width:22px; height:22px; filter:drop-shadow(0 1.5px 0 rgba(0,0,0,.35))}
.mini-btn{min-height:44px; padding:0 12px; border-radius:14px; font-size:.9375rem; color:var(--ink); background:linear-gradient(180deg,#FFFDF5,#F6DFAF); box-shadow:inset 0 -3px 0 rgba(190,120,40,.25), 0 4px 0 var(--choco)}
.relics{display:flex; gap:6px; flex-wrap:wrap; min-height:38px}
.relic{width:38px; height:38px; padding:6px; border-radius:50%; background:radial-gradient(circle at 40% 35%,#FFF7E4,#F3C47A); border:3px solid #C98A1C; box-shadow:0 0 0 2px var(--choco), 0 3px 0 2px var(--choco-d)}

/* 지도: 양피지 판 */
.map{position:relative; flex:1; min-height:0; overflow:hidden; background:radial-gradient(ellipse at 50% 40%,#FFF4D6 0%,#F6DDA8 60%,#E9C27C 100%)}
.map::before{content:''; position:absolute; inset:0; box-shadow:inset 0 0 40px rgba(120,60,10,.35); border-radius:inherit; pointer-events:none}
.map-in{position:absolute; inset:50px 0 44px}
.roads{position:absolute; inset:0; overflow:visible}
.roads line{stroke:rgba(90,46,20,.55); stroke-width:3.5; stroke-dasharray:2 9; stroke-linecap:round; vector-effect:non-scaling-stroke}
.roads line.walked{stroke:var(--choco); stroke-width:5; stroke-dasharray:none}
.node{position:absolute; width:54px; height:54px; padding:7px; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(circle at 40% 35%,#FFFDF5,#F3D59A); border:3px solid var(--choco); box-shadow:0 4px 0 var(--choco-d)}
.node img{display:block; width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 2px 0 rgba(59,28,10,.3))}
.node.boss{width:84px; height:84px; padding:6px; border-color:#9C2447; box-shadow:0 0 0 3px #FFC83D, 0 0 0 6px var(--choco), 0 6px 0 6px var(--choco-d)}
.node.open{border:3px solid var(--choco); box-shadow:0 0 0 3px #FFD23F, 0 0 0 6px var(--choco), 0 5px 0 6px var(--choco-d); animation:glow 1.3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px #FFE78A, 0 0 0 7px var(--choco), 0 5px 0 7px var(--choco-d), 0 0 22px 8px rgba(255,210,63,.75)}}
.node.done{filter:grayscale(.6) brightness(.9); opacity:.7}
.node.here{opacity:1; filter:none; border-color:var(--good)}
.node.sel{transform:translate(-50%,-50%) scale(1.15)}
.info{min-height:104px; padding:12px 14px; display:flex; gap:12px; align-items:center}
.info div{flex:1; min-width:0}
.info h3{margin:0; font-family:var(--font-sign); font-weight:400; font-size:1.25rem; line-height:1.25; color:var(--choco)}
.info p{margin:2px 0 0; font-size:.875rem; color:var(--ink-2)}
.info .cta{min-height:52px; font-size:1.1875rem; flex:none}

/* 전투 표시 */
#battle{padding:0; background:#F7DCA6}
#cv{position:absolute; inset:0; width:100%; height:100%; touch-action:none}
.hud{position:absolute; left:0; right:0; top:0; padding:calc(8px + env(safe-area-inset-top,0px)) 12px 0; display:flex; flex-direction:column; gap:7px; pointer-events:none}
.hud-row{display:flex; align-items:center; gap:8px}
.timer{font-family:var(--font-sign); font-size:1.375rem; font-variant-numeric:tabular-nums; min-width:3.6em; text-align:center; padding:1px 10px; border-radius:999px; color:#FFF; text-shadow:0 2px 0 var(--choco-d); background:linear-gradient(180deg,#80492A,#5A2E14); border:2.5px solid var(--choco-d); box-shadow:inset 0 2px 0 rgba(255,255,255,.18), 0 3px 0 rgba(59,28,10,.35)}
.meter{flex:1; height:18px; border-radius:10px; background:#4A2412; overflow:hidden; border:2.5px solid var(--choco-d); box-shadow:0 3px 0 rgba(59,28,10,.35)}
.meter i{display:block; height:100%; width:100%; transform-origin:left; border-radius:7px; background:linear-gradient(180deg,#FF9AA8,#E0445A 60%,#B8283E); box-shadow:inset 0 3px 0 rgba(255,255,255,.4)}
.meter.xp{height:15px} .meter.xp i{background:linear-gradient(180deg,#B8F07A,#5FC23A 60%,#3E9020)}
.lv{flex:none; font-family:var(--font-sign); font-size:.9375rem; min-width:3.4em; text-align:center; padding:0 8px; border-radius:999px; color:#FFF; text-shadow:var(--ol); background:linear-gradient(180deg,#8FD3FF,#3E8EDE); border:2.5px solid var(--choco-d)}
.pause{pointer-events:auto; width:46px; height:46px; border-radius:14px; color:var(--choco); background:linear-gradient(180deg,#FFFDF5,#F6DFAF); box-shadow:inset 0 -3px 0 rgba(190,120,40,.25), 0 4px 0 var(--choco)}
.potion{width:30px; height:30px; filter:drop-shadow(0 2px 0 rgba(59,28,10,.35))}
.hearts{display:flex; gap:2px; padding:3px 8px; border-radius:999px; background:linear-gradient(180deg,#80492A,#5A2E14); border:2.5px solid var(--choco-d); box-shadow:inset 0 2px 0 rgba(255,255,255,.18), 0 3px 0 rgba(59,28,10,.35)}
.hearts i{display:block; width:26px; height:26px; filter:drop-shadow(0 1.5px 0 rgba(0,0,0,.4))}
.hearts i.off{opacity:.55}
.hearts i.broke{animation:heartBreak .5s cubic-bezier(.2,.8,.3,1)}
.hearts.shake{animation:hudShake .35s}
.hud-gap{flex:1}
.chip i.hrt{width:20px; height:20px} .chip i.hrt.off{opacity:.55}
@keyframes heartBreak{0%{transform:scale(1.7) rotate(-12deg)}40%{transform:scale(.8) rotate(8deg)}100%{transform:scale(1)}}
@keyframes hudShake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.bossbar{margin-top:2px; display:flex; flex-direction:column; gap:2px} .bossbar .meter{flex:none; height:20px} .bossbar .meter i{background:linear-gradient(180deg,#D9A6FF,#9B59D0 60%,#6A2FA0)}
.bossname{align-self:center; font-family:var(--font-sign); font-size:1rem; color:#FFF; text-shadow:var(--ol), 0 3px 0 var(--choco)}
.toast{position:absolute; left:0; right:0; top:26%; text-align:center; font-family:var(--font-sign); font-size:1.75rem; color:#FFE45C; text-shadow:var(--ol), 0 4px 0 var(--choco), 0 8px 14px rgba(0,0,0,.25); pointer-events:none; animation:toastIn .35s var(--bounce)}
@keyframes toastIn{from{transform:scale(.4); opacity:0}}

/* 창 */
.overlay{position:fixed; inset:0; z-index:20; background:rgba(40,18,6,.62); display:grid; place-items:center; padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.card{width:min(100%, 380px); max-height:100%; overflow:auto; padding:14px 14px 16px; animation:pop .32s var(--bounce)}
@keyframes pop{from{opacity:0; transform:scale(.85)}}
.card h2{margin:0 0 4px; padding:7px 14px 9px; text-align:center; font-family:var(--font-sign); font-weight:400; font-size:1.5rem; line-height:1.2; color:#FFF; text-shadow:var(--ol), 0 3px 0 var(--choco); text-wrap:balance;
  background:linear-gradient(180deg,#FF8FB0 0%,#FF5C8A 55%,#D93A68 100%); border:3px solid var(--choco); border-radius:14px; box-shadow:inset 0 3px 0 rgba(255,255,255,.45), inset 0 -4px 0 rgba(140,20,60,.3), 0 4px 0 var(--choco)}
.card p{margin:8px 2px 0; color:var(--ink-2); font-size:.9375rem; text-align:center}
.card .pic{height:110px; margin:4px auto 6px; display:flex; justify-content:center}
.card .pic img{height:100%; filter:drop-shadow(0 5px 0 rgba(59,28,10,.25))}
.card .pic svg{width:96px; height:96px; filter:drop-shadow(0 4px 0 rgba(59,28,10,.3))}
.opts{display:flex; flex-direction:column; gap:10px; margin-top:14px}
.opt{position:relative; display:flex; align-items:center; gap:12px; width:100%; min-height:68px; padding:9px 12px 9px 9px; text-align:left; border-radius:16px; background:linear-gradient(180deg,#FFFFFF,#FFF3D8); border:3px solid var(--choco); box-shadow:inset 0 -4px 0 rgba(200,130,50,.18), 0 4px 0 var(--choco); transition:transform 80ms, box-shadow 80ms; animation:optIn .38s var(--bounce) both}
.opt:nth-child(2){animation-delay:.05s} .opt:nth-child(3){animation-delay:.1s} .opt:nth-child(4){animation-delay:.15s} .opt:nth-child(n+5){animation-delay:.2s}
@keyframes optIn{from{opacity:0; transform:translateY(14px) scale(.94)}}
.opt:active{transform:translateY(4px); box-shadow:0 0 0 var(--choco)}
.opt.on{background:linear-gradient(180deg,#FFFBE0,#FFE38A); box-shadow:0 0 0 3px #FFD23F, 0 4px 0 3px var(--choco)}
.opt.on::after{content:'✓'; position:absolute; right:-6px; top:-8px; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-family:var(--font-sign); font-size:15px; color:#FFF; background:var(--good); border:2.5px solid var(--choco)}
.opt[aria-disabled="true"]{filter:grayscale(.85); opacity:.55}
.opt .ic{flex:none; width:52px; height:52px; padding:7px; border-radius:14px; background:radial-gradient(circle at 40% 30%,#FFF7E4,#E9B97A); border:3px solid #9A5A2A; box-shadow:inset 0 2px 0 rgba(255,255,255,.6)}
.opt.r1 .ic{background:radial-gradient(circle at 40% 30%,#EAF6FF,#8FC8F5); border-color:#2F74C0}
.opt.r2 .ic{background:radial-gradient(circle at 40% 30%,#FFF6D0,#FFC83D); border-color:#B5651D; box-shadow:inset 0 2px 0 rgba(255,255,255,.6), 0 0 12px 2px rgba(255,190,40,.8); animation:shine 1.6s ease-in-out infinite}
@keyframes shine{50%{box-shadow:inset 0 2px 0 rgba(255,255,255,.6), 0 0 18px 5px rgba(255,210,63,.95)}}
.opt.r2{border-color:#8A4B10; background:linear-gradient(180deg,#FFFDF0,#FFEBB0)}
.opt .tx{flex:1; min-width:0}
.opt b{display:block; font-family:var(--font-sign); font-weight:400; font-size:1.0625rem; line-height:1.3; color:var(--choco)}
.opt span{display:block; font-size:.8125rem; line-height:1.4; color:var(--ink-2)}
.opt .ic svg{width:100%; height:100%}
.opt em{flex:none; font-style:normal; font-family:var(--font-sign); font-size:.9375rem; color:#FFF; text-shadow:0 1.5px 0 var(--choco-d); padding:3px 10px; border-radius:999px; background:linear-gradient(180deg,#FFD95A,#E9A400); border:2.5px solid var(--choco)}
.card .cta,.card .btn{width:100%; margin-top:14px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
@media (prefers-reduced-motion: reduce){ .screen,.card,.opt,.toast,.t-art img,.node.open,.opt.r2 .ic,.hearts i.broke,.hearts.shake{animation:none} }

/* 카드 뒤집기 */
.opts.flip{perspective:900px}
.opts.lock{pointer-events:none}
.opts.flip .opt{animation:cardFlip .6s cubic-bezier(.3,.7,.3,1) var(--d,0ms) both}
.opts.flip .opt::before{content:'?'; position:absolute; inset:-3px; z-index:3; border-radius:16px; border:3px solid var(--choco); display:grid; place-items:center; font-family:var(--font-sign); font-size:2rem; color:#FFF7E4; text-shadow:var(--ol), 0 3px 0 var(--choco);
  background:radial-gradient(circle at 20% 30%,rgba(150,80,20,.35) 3px,transparent 4px) 0 0/26px 22px, radial-gradient(circle at 70% 70%,rgba(150,80,20,.3) 2.5px,transparent 3.5px) 0 0/26px 22px, linear-gradient(180deg,#F6C97E,#D9933F);
  box-shadow:inset 0 0 0 3px rgba(255,240,200,.6); animation:hideBack .6s var(--d,0ms) both}
.opts.flip .opt.r2.shown{animation:cardFlip .6s cubic-bezier(.3,.7,.3,1) var(--d,0ms) both, rareGlow 1.4s ease-in-out calc(var(--d,0ms) + .6s) infinite}
@keyframes cardFlip{0%{transform:rotateY(0) scale(.95)}50%{transform:rotateY(90deg) scale(1.05)}80%{transform:rotateY(-8deg) scale(1.03)}100%{transform:rotateY(0) scale(1)}}
@keyframes hideBack{0%,49.9%{opacity:1}50%,100%{opacity:0; visibility:hidden}}
@keyframes rareGlow{50%{box-shadow:0 0 0 3px #FFD23F, 0 4px 0 3px var(--choco), 0 0 24px 6px rgba(255,200,40,.85)}}

/* 효과 층 */
.fx{position:fixed; inset:0; z-index:40; pointer-events:none; overflow:hidden}
.conf{position:absolute; width:9px; height:13px; border-radius:2px; box-shadow:0 0 0 1.5px rgba(59,28,10,.35)}
.spk{position:absolute; width:14px; height:14px; background:#FFE45C; clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%); filter:drop-shadow(0 0 4px #FFF)}
.fly{position:absolute; width:28px; height:28px; filter:drop-shadow(0 2px 0 rgba(59,28,10,.4))}
.chip.bump{animation:bump .25s var(--bounce)}
@keyframes bump{40%{transform:scale(1.18)}}
.win{position:absolute; inset:0; pointer-events:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; background:radial-gradient(circle at 50% 42%,rgba(255,236,170,.35),rgba(40,18,6,.55) 70%); animation:fade .2s}
.win.out{opacity:0; transition:opacity .25s}
.win .rays{position:absolute; left:50%; top:42%; width:780px; height:780px; margin:-390px 0 0 -390px; border-radius:50%; background:repeating-conic-gradient(rgba(255,228,92,.55) 0 9deg,rgba(255,228,92,0) 9deg 22deg); -webkit-mask:radial-gradient(circle,#000 18%,transparent 62%); mask:radial-gradient(circle,#000 18%,transparent 62%); animation:raysIn .5s var(--bounce) both, spin 9s linear infinite}
@keyframes raysIn{from{transform:scale(0)}}
@keyframes spin{to{rotate:360deg}}
.win-t{position:relative; margin-top:-8vh; font-family:var(--font-sign); font-size:3.4rem; line-height:1.1; text-align:center; color:#FFE45C; text-shadow:-3px -3px 0 var(--choco),3px -3px 0 var(--choco),-3px 3px 0 var(--choco),3px 3px 0 var(--choco),0 -3px 0 var(--choco),0 3px 0 var(--choco),-3px 0 0 var(--choco),3px 0 0 var(--choco),0 8px 0 var(--choco-d),0 14px 20px rgba(0,0,0,.35); animation:stamp .55s var(--bounce) both; padding:0 16px}
.win.big .win-t{font-size:2.6rem}
@keyframes stamp{0%{transform:scale(3) rotate(-8deg); opacity:0}60%{transform:scale(.92) rotate(-3deg); opacity:1}100%{transform:scale(1) rotate(-3deg)}}
.win-g{position:relative; display:flex; align-items:center; gap:6px; padding:4px 16px 4px 8px; border-radius:999px; font-family:var(--font-sign); font-size:1.5rem; color:#FFF; text-shadow:0 2px 0 var(--choco-d); background:linear-gradient(180deg,#80492A,#5A2E14); border:3px solid var(--choco-d); animation:optIn .4s var(--bounce) .3s both}
.win-g i{display:block; width:30px; height:30px}
/* 유물 받기: 빛줄기 위의 메달 */
.prize{position:relative; height:130px; display:grid; place-items:center; margin-top:6px}
.prize .rays{position:absolute; left:50%; top:50%; width:300px; height:300px; margin:-150px 0 0 -150px; border-radius:50%; background:repeating-conic-gradient(rgba(255,200,40,.5) 0 10deg,rgba(255,200,40,0) 10deg 24deg); -webkit-mask:radial-gradient(circle,#000 20%,transparent 65%); mask:radial-gradient(circle,#000 20%,transparent 65%); animation:raysIn .5s var(--bounce) both, spin 8s linear infinite}
.medal{position:relative; width:96px; height:96px; padding:16px; border-radius:50%; background:radial-gradient(circle at 40% 35%,#FFF7E4,#FFC83D); border:4px solid #B5651D; box-shadow:0 0 0 3px var(--choco), 0 6px 0 3px var(--choco-d), 0 0 30px 8px rgba(255,210,63,.7); animation:medalIn .6s var(--bounce) both}
@keyframes medalIn{0%{transform:scale(0) rotate(-180deg)}100%{transform:none}}
.card.reward{overflow:hidden}
@media (prefers-reduced-motion: reduce){.win .rays,.prize .rays,.medal,.win-t,.win-g,.chip.bump{animation:none}}
</style>
</head>
<body>
<section class="screen" id="title">
  <div class="col">
    <div class="t-art" aria-hidden="true"><img class="b" src="img/boss.png" alt=""><img class="e1" src="img/jelly.png" alt=""><img class="e2" src="img/cookie.png" alt=""><img class="h" src="img/hero.png" alt=""></div>
    <h1 class="wordmark"><span class="s">쪈이의</span>디저트 대작전</h1>
    <p class="sub" id="titleSub"></p>
    <div class="stack">
      <button class="cta green" id="btnContinue" type="button">이어서 하기</button>
      <button class="cta" id="btnNew" type="button">모험 떠나기</button>
      <button class="btn" id="btnInstall" type="button" hidden>홈 화면에 앱으로 설치하기</button>
      <button class="btn" id="btnSet" type="button">소리와 진동 바꾸기</button>
    </div>
  </div>
</section>

<section class="screen" id="map" hidden>
  <div class="col">
    <div class="bar"><div class="l"><span class="chip" id="hpChip"></span><span class="chip" id="goldChip"></span><span class="chip" id="potChip"></span></div><div class="r"><button class="mini-btn" id="btnDeck" type="button">덱 보기</button><button class="mini-btn" id="btnMenu" type="button">메뉴</button></div></div>
    <div class="relics" id="relics"></div>
    <div class="map" id="mapBox"></div>
    <div class="info" id="info"></div>
  </div>
</section>

<section class="screen" id="battle" hidden>
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="hud-row"><span class="timer" id="timer">2:00</span><div class="hearts" id="hearts" aria-label="하트"></div><span class="hud-gap"></span><span class="potion" id="potHud"></span><button class="pause" id="btnPause" type="button" aria-label="일시정지">II</button></div>
    <div class="hud-row"><span class="lv" id="lvText">Lv 1</span><div class="meter xp"><i id="xpBar"></i></div></div>
    <div class="bossbar" id="bossBar" hidden><span class="bossname" id="bossName"></span><div class="meter"><i id="bossHp"></i></div></div>
  </div>
  <div class="toast" id="toast" hidden></div>
</section>

<div class="overlay" id="overlay" hidden><div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle"></div></div>
<div class="fx" id="fx" aria-hidden="true"></div>
<script src="game.js"></script>
</body>
</html>
