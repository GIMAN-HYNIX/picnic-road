<title>소풍 가는 길</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: a walk up a hill under an open sky. One column: sign and hearts, the friends walking with you, then either the trail map with a place card under it, or one puzzle filling the screen. */
:root{
  /* 60% canvas: clear sky */
  --canvas:#DCF0FB;
  /* 30% surfaces */
  --surface:#FFFFFF; --surface-top:#FFFFFF;
  --ink:#24324A; --ink-2:#53627C;
  --border:rgba(36,50,74,.13); --border-strong:rgba(36,50,74,.28);
  /* 10% accent: strawberry milk, for where you can go and what to press */
  --accent:#F25C8A; --on-accent:#3A0A1C;
  --good:#3FAE6B; --hill:#BFE6B5; --tile:#E4F0F8; --tile-on:#BDE6C4; --trail:rgba(255,255,255,.9);
  --scrim:rgba(36,50,74,.5);
  --shadow:0 1px 3px rgba(36,50,74,.07);
  --edge-light:0 0 0 rgba(255,255,255,0);

  --font-sign:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-ui:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --text-meta:.75rem; --text-2:.875rem; --text-body:1rem; --text-h2:1.375rem; --text-h1:1.75rem;
  --m100:100ms; --m150:150ms; --m200:200ms; --m300:300ms;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-in:cubic-bezier(.7,0,.84,0);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#161A35; --surface:#212648; --surface-top:#2A3058;
    --ink:#EEF1FF; --ink-2:#A9B0D6;
    --border:rgba(238,241,255,.13); --border-strong:rgba(238,241,255,.28);
    --accent:#FF8FB0; --on-accent:#3A0A1C;
    --good:#6FD39A; --hill:#2F5A45; --tile:#2C3260; --tile-on:#3F7458; --trail:rgba(220,240,230,.45);
    --scrim:rgba(6,8,20,.72);
    --shadow:0 0 0 rgba(0,0,0,0);
    --edge-light:inset 0 1px 0 rgba(255,255,255,.05);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#161A35; --surface:#212648; --surface-top:#2A3058;
  --ink:#EEF1FF; --ink-2:#A9B0D6;
  --border:rgba(238,241,255,.13); --border-strong:rgba(238,241,255,.28);
  --accent:#FF8FB0; --on-accent:#3A0A1C;
  --good:#6FD39A; --hill:#2F5A45; --tile:#2C3260; --tile-on:#3F7458; --trail:rgba(220,240,230,.45);
  --scrim:rgba(6,8,20,.72);
  --shadow:0 0 0 rgba(0,0,0,0);
  --edge-light:inset 0 1px 0 rgba(255,255,255,.05);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
html{font-size:16px}
body{
  margin:0; background:var(--canvas); color:var(--ink);
  font-family:var(--font-ui); font-size:var(--text-body); font-weight:400; line-height:1.55; word-break:keep-all;
  padding-block:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex; justify-content:center; overflow-x:hidden; overscroll-behavior:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
svg{display:block; width:100%; height:100%}

.app{width:100%; max-width:460px; height:100%; min-height:0; display:flex; flex-direction:column; gap:10px}
.top{display:flex; align-items:center; justify-content:space-between; gap:10px}
.top h1{margin:0; font-family:var(--font-sign); font-weight:400; font-size:1.5rem; line-height:1.2; white-space:nowrap}
.top-r{display:flex; align-items:center; gap:10px; min-width:0}
.hearts{display:flex; gap:1px}
.hearts span{width:20px; height:20px}
.text-btn{min-height:44px; padding:0 12px; border-radius:10px; background:transparent; border:1px solid var(--border-strong); font-size:var(--text-2); line-height:1.2}
.view{flex:1; min-height:0; display:flex; flex-direction:column; gap:10px; animation:view-in var(--m200) var(--ease-out)}
@keyframes view-in{from{opacity:0}}

/* first screen */
.on-title .top{display:none}
.title{justify-content:center; gap:14px; text-align:center; overflow-y:auto}
.title-art{position:relative; flex:none; height:min(250px, 32vh); overflow:hidden}
.t-cloud{position:absolute; left:50%; top:0; width:min(150px, 19vh); height:min(150px, 19vh); transform:translateX(-50%)}
.title-pair{display:grid; grid-template-columns:1fr 1fr; gap:8px}

/* picnic notebook */
.book{gap:12px}
.book-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding-top:4px}
.book-head h2{margin:0; font-family:var(--font-sign); font-weight:400; font-size:var(--text-h1); line-height:1.2}
.book-head p{margin:0; font-family:var(--font-sign); font-size:1.125rem; font-variant-numeric:tabular-nums}
.book-body{flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:8px}
.book-body h3{margin:10px 0 0; font-family:var(--font-sign); font-weight:400; font-size:1.25rem; line-height:1.25}
.book-body h3:first-child{margin-top:0}
.book-sub{margin:0; font-size:var(--text-2); color:var(--ink-2)}
.stages, .perks{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.stage-row{display:flex; align-items:center; gap:12px; width:100%; min-height:56px; padding:8px 12px; text-align:left; border-radius:14px; background:var(--surface); border:1px solid var(--border-strong)}
.stage-row.sel{border:2px solid var(--accent); padding:7px 11px}
.stage-row[disabled]{opacity:.5; cursor:default}
.stage-row .num{flex:none; width:32px; height:32px; display:grid; place-items:center; border-radius:50%; background:var(--tile); font-family:var(--font-sign); font-variant-numeric:tabular-nums}
.perk{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:14px; background:var(--surface); border:1px solid var(--border)}
.stage-row .txt, .perk .txt{flex:1; min-width:0}
.stage-row .txt b, .perk .txt b{display:block; font-family:var(--font-sign); font-weight:400; font-size:var(--text-body); line-height:1.3}
.stage-row .txt span, .perk .txt span{display:block; font-size:var(--text-2); line-height:1.45; color:var(--ink-2)}
.stage-row .state, .perk .state{flex:none; font-size:var(--text-meta); color:var(--ink-2)}
.buy{flex:none; min-height:44px; padding:0 12px; border:0; border-radius:10px; background:var(--accent); color:var(--on-accent); font-family:var(--font-sign); font-size:var(--text-2)}
.buy[aria-disabled="true"]{background:transparent; border:1px solid var(--border-strong); color:var(--ink-2)}
.t-hill{position:absolute; left:-12%; right:-12%; bottom:-46px; height:150px; border-radius:50% 50% 0 0 / 100% 100% 0 0; background:var(--hill)}
.t-buds{position:absolute; left:0; right:0; bottom:22px; display:flex; justify-content:center; gap:2px}
.t-buds span{width:54px; height:54px}
.wordmark{margin:0; font-family:var(--font-sign); font-weight:400; font-size:2.75rem; line-height:1.1}
.title-sub{margin:0; font-size:var(--text-2); color:var(--ink-2); text-wrap:balance}
.title-btns{display:flex; flex-direction:column; gap:8px; margin-top:6px}
.title-btns .cta{margin-top:0}
.title-tip{margin:0; min-height:1.4em; font-size:var(--text-meta); line-height:1.4; color:var(--ink-2); text-wrap:balance}

/* the friends walking with you */
.party{display:flex; align-items:center; gap:8px}
.bud{position:relative; width:46px; height:46px; padding:3px; border-radius:14px; background:var(--surface); border:1px solid var(--border); box-shadow:var(--edge-light)}
.bud.none{background:transparent; border-style:dashed; border-color:var(--border-strong); font-family:var(--font-sign); font-size:var(--text-2); color:var(--ink-2)}
.bud b{position:absolute; right:-5px; bottom:-5px; padding:0 5px; border-radius:8px; background:var(--ink); color:var(--surface); font-family:var(--font-sign); font-weight:400; font-size:var(--text-meta); line-height:1.4}
.hints{margin-left:auto; display:flex; align-items:center; gap:5px; font-size:var(--text-2); font-variant-numeric:tabular-nums}
.hints span{width:18px; height:18px; color:var(--ink-2)}

/* trail map */
.map{position:relative; flex:1; min-height:0; background:var(--surface); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow), var(--edge-light); overflow:hidden}
.map::before{content:""; position:absolute; left:-25%; right:-25%; bottom:-34%; height:80%; border-radius:50%; background:var(--hill); opacity:.5}   /* the hill being climbed */
.map-in{position:absolute; inset:44px 0 38px}
.walker{position:absolute; left:0; top:0; z-index:2; width:30px; height:30px; pointer-events:none; transition:transform var(--m300) var(--ease-out)}
.roads{position:absolute; inset:0; overflow:visible}
.roads line{stroke:var(--border-strong); stroke-width:2; stroke-dasharray:5 6; vector-effect:non-scaling-stroke}
.roads line.walked{stroke:var(--ink); stroke-dasharray:none}
.node{position:absolute; width:50px; height:50px; padding:8px; transform:translate(-50%,-50%); border-radius:50%; background:var(--surface); border:2px solid var(--border-strong)}
.node{transition:transform var(--m100) var(--ease-out)}
.node:active{transform:translate(-50%,-50%) scale(.94)}
.node.boss{width:72px; height:72px; padding:6px}
.node.open{border:3px solid var(--accent); padding:7px}
.node.done{opacity:.5}
.node.here{opacity:1; border-color:var(--ink)}
.node.sel{outline:3px solid var(--ink); outline-offset:2px}
.node i{position:absolute; display:block; border-radius:50%}
.node i.hot{right:-7px; top:-7px; width:24px; height:24px}
.node i.tick{right:-4px; bottom:-4px; width:20px; height:20px; padding:4px; background:var(--good)}

/* place card */
.info{min-height:112px; padding:12px 14px; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--edge-light); display:flex; gap:12px; align-items:center}
.info-txt{flex:1; min-width:0}
.info h3{margin:0; font-family:var(--font-sign); font-weight:400; font-size:1.125rem; line-height:1.25}
.info p{margin:2px 0 0; font-size:var(--text-2); color:var(--ink-2)}
.go{flex:none; min-height:48px; padding:0 16px; border:0; border-radius:12px; background:var(--accent); color:var(--on-accent); font-family:var(--font-sign); font-size:var(--text-body)}

/* puzzle screen */
.phead{display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding-top:8px; border-top:1px solid var(--border-strong)}
.phead h2{margin:0; font-family:var(--font-sign); font-weight:400; font-size:var(--text-h2); line-height:1.2}
.phead p{margin:0; font-size:var(--text-2); white-space:nowrap; font-variant-numeric:tabular-nums}
.pgoal{display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:32px; font-size:var(--text-2); font-variant-numeric:tabular-nums}
.pgoal > div{display:flex; align-items:center; gap:10px; color:var(--ink-2)}
.pgoal p{margin:0; font-family:var(--font-sign); font-size:1.125rem}
.pgoal p.low{color:var(--accent)}
.gchip{display:flex; align-items:center; gap:3px}
.gchip svg{width:28px; height:28px}
.gchip b{font-family:var(--font-sign); font-weight:400; font-size:1.125rem; color:var(--ink)}
.note-row{display:flex; align-items:center; gap:10px; min-height:3.1em}
.who{flex:none; width:44px; height:44px}
.note{flex:1; min-width:0; margin:0; font-size:var(--text-2); color:var(--ink-2)}
.burst{position:absolute; left:50%; top:50%; width:0; height:0; z-index:6; pointer-events:none}
.burst i{position:absolute; left:-5px; top:-5px; width:10px; height:10px; border-radius:50%}
.board-wrap{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; background:var(--surface); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow), var(--edge-light); overflow:hidden}
.board{position:relative}
.tool{width:100%; min-height:48px; border-radius:12px; background:var(--surface); border:1px solid var(--border-strong); font-size:var(--text-2)}
.ring::after{content:""; position:absolute; inset:6%; border-radius:28%; border:3px solid var(--ink); pointer-events:none}

/* 별사탕 팡 */
.pop{position:relative; overflow:hidden; border-radius:12px}
.pt{position:absolute; left:0; top:0; padding:0; border:0; background:none; transition:transform var(--m200) var(--ease-out), opacity var(--m150) var(--ease-in)}
.pt.still{transition:none}
.pt svg{padding:9%; transition:transform var(--m150) var(--ease-in)}
.pt.out{opacity:0}
.pt.out svg{transform:scale(.3)}
/* 꽃길 걷기 */
.path{position:relative; touch-action:none}
.pc, .pb{position:absolute}
.pc::before, .pc::after{content:""; position:absolute; inset:5%; border-radius:26%; background:var(--tile)}
.pc::after{background:var(--tile-on); opacity:0; transition:opacity var(--m200) var(--ease-out)}
.pc.on::after{opacity:1}
.trail{position:absolute; inset:0; pointer-events:none}
.trail polyline{fill:none; stroke:var(--trail); stroke-width:.26; stroke-linecap:round; stroke-linejoin:round}
.pb{padding:0; border:0; background:none; border-radius:26%}
.pb svg{padding:13%; transform:scale(0); transition:transform var(--m200) var(--ease-out); pointer-events:none}
.pb.on svg{transform:scale(1)}
.head{position:absolute; left:0; top:0; pointer-events:none; transition:transform var(--m150) var(--ease-out)}
.head svg{position:absolute; right:-8%; top:-14%; width:56%; height:56%}
/* 탕후루 정리 */
.sort{position:relative}
.rail{position:absolute; z-index:3; border-radius:999px; background:var(--tile); border:1px solid var(--border)}
.stick{position:absolute; z-index:1; border-radius:999px; background:#D8B57C}
.fr{position:absolute; left:0; top:0; z-index:2; pointer-events:none; transition:transform var(--m200) var(--ease-out)}
.fr.up{z-index:4}
.glaze{opacity:0; transition:opacity var(--m300) var(--ease-out)}
.fr.glazed .glaze{opacity:1}
.sk{position:absolute; z-index:5; padding:0; border:0; background:none; border-radius:14px}
.sk.from{outline:2px solid var(--ink); outline-offset:-3px}
.sk.to{outline:2px dashed var(--ink); outline-offset:-3px}
/* 볶음면 잇기 */
.rot{display:grid}
.rc{position:relative; padding:0; border:0; background:none; border-radius:10px}
.rc::before{content:""; position:absolute; inset:2px; border-radius:10px; background:var(--tile)}
.rr{position:absolute; inset:0; transition:transform var(--m150) var(--ease-out)}
.hot-layer{opacity:0; transition:opacity var(--m200) var(--ease-out)}
.rc.hot .hot-layer{opacity:1}
.fire{position:absolute; inset:20%; pointer-events:none}
/* 칩 뒤집기 */
.flip{display:grid}
.fc{position:relative; padding:0; border:0; background:none; border-radius:50%; perspective:320px}
.chip{position:absolute; inset:5%; transform-style:preserve-3d; transform:rotateY(calc(var(--turns) * 180deg)); transition:transform var(--m300) var(--ease-out); transition-delay:var(--wait, 0ms)}
.chip.still{transition:none}
.face{position:absolute; inset:0; -webkit-backface-visibility:hidden; backface-visibility:hidden}
.face.honey{transform:rotateY(180deg)}

/* cards */
.overlay{position:fixed; inset:0; z-index:20; background:var(--scrim); display:grid; place-items:center; padding:20px}
.overlay[hidden]{display:none}
.card{width:min(100%, 360px); max-height:100%; overflow:auto; background:var(--surface-top); border:1px solid var(--border-strong); border-radius:20px; padding:22px 18px 18px; box-shadow:var(--edge-light); animation:card-in var(--m200) var(--ease-out)}
@keyframes card-in{from{opacity:0; transform:translateY(8px)}}
.card h2{margin:0; font-family:var(--font-sign); font-weight:400; font-size:var(--text-h1); line-height:1.2; text-wrap:balance}
.card p{margin:8px 0 0; color:var(--ink-2)}
.card .pic{width:112px; height:112px; margin:0 auto 8px}
.opts{display:flex; flex-direction:column; gap:8px; margin-top:16px}
.opt{display:flex; align-items:center; gap:12px; width:100%; padding:10px 12px; text-align:left; border-radius:14px; background:var(--surface); border:1px solid var(--border-strong)}
.opt:active{background:var(--canvas)}
.opts .opt{animation:opt-in var(--m200) var(--ease-out) backwards; animation-delay:calc(var(--i, 0) * 30ms)}
@keyframes opt-in{from{opacity:0; transform:translateY(4px)}}
.hearts.hit{animation:shake var(--m300) var(--ease-out)}
@keyframes shake{20%{transform:translateX(-4px)} 50%{transform:translateX(4px)} 80%{transform:translateX(-2px)}}
.bud.grew{animation:grew var(--m300) var(--ease-out)}
@keyframes grew{40%{transform:scale(1.14)}}
.opt-pic{flex:none; width:48px; height:48px}
.opt-txt{min-width:0}
.opt-txt b{display:block; font-family:var(--font-sign); font-weight:400; font-size:var(--text-body); line-height:1.3}
.opt-txt span{display:block; font-size:var(--text-2); line-height:1.45; color:var(--ink-2)}
.cta{display:block; width:100%; min-height:52px; margin-top:18px; border:0; border-radius:12px; background:var(--accent); color:var(--on-accent); font-family:var(--font-sign); font-size:1.125rem}
.cta:active, .go:active{opacity:.85}

@media (prefers-reduced-motion: reduce){
  .pt, .pt svg, .pb svg, .pc::after, .head, .fr, .rr, .hot-layer, .chip, .glaze, .walker, .node{transition:none}
  .card, .view, .opt, .hearts.hit, .bud.grew{animation:none}
}
</style>

<div class="app">
  <header class="top">
    <h1>소풍 가는 길</h1>
    <div class="top-r"><div class="hearts" id="hearts" role="img" aria-label="하트"></div><button class="text-btn" id="btnMenu" type="button">메뉴</button></div>
  </header>

  <section class="view title" id="viewTitle">
    <div class="title-art" id="titleArt" aria-hidden="true"></div>
    <h1 class="wordmark">소풍 가는 길</h1>
    <p class="title-sub" id="titleSub"></p>
    <div class="title-btns">
      <button class="cta" id="btnContinue" type="button">이어서 하기</button>
      <button class="tool" id="btnNew" type="button">새 소풍 떠나기</button>
      <button class="tool" id="btnInstall" type="button" hidden>홈 화면에 앱으로 설치하기</button>
      <div class="title-pair">
        <button class="tool" id="btnBook" type="button">소풍 수첩 열기</button>
        <button class="tool" id="btnSet" type="button">소리와 진동 바꾸기</button>
      </div>
    </div>
    <p class="title-tip" id="titleTip"></p>
  </section>

  <section class="view book" id="viewBook" hidden>
    <div class="book-head"><h2>소풍 수첩</h2><p id="stampCount"></p></div>
    <div class="book-body" id="bookBody"></div>
    <button class="tool" id="btnBookBack" type="button">처음 화면으로 돌아가기</button>
  </section>

  <section class="view" id="viewMap" hidden>
    <div class="party" id="party"></div>
    <div class="map" id="map"></div>
    <div class="info" id="info"></div>
  </section>

  <section class="view" id="viewPuzzle" hidden>
    <div class="phead"><h2 id="pName"></h2><p id="pRate"></p></div>
    <div class="pgoal"><div id="pGoal"></div><p id="pLeft"></p></div>
    <div class="note-row"><span class="who" id="who" hidden></span><p class="note" id="note" aria-live="polite"></p></div>
    <div class="board-wrap" id="boardWrap" style="position:relative"><div class="board" id="board"></div></div>
    <button class="tool" id="btnHint" type="button">힌트 쓰기</button>
  </section>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle"></div>
</div>

<script>
const CONFIG = { name: '쪈이' };   // 소풍을 떠나는 사람

const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const D4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];

/* ───── saved run (this browser only) ───── */
const KEY = 'picnic-road-v1';
let S = { muted: false, vib: true, wins: 0, run: null, meta: null };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
/* what stays between picnics: stamps, things bought with them, and how far up the weather ladder you have got */

let ac, bus, noiseBuf;
function audio() {

  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(o.vol || 0.12, t0 + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  osc.connect(g); g.connect(bus);
  osc.start(t0); osc.stop(t0 + d + 0.05);
}

  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(o.vol || 0.12, t0 + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);

      b.type = 'button'; b.dataset.i = i; box.appendChild(b);

/* ───── the trail: three lanes, seven stops, then the cloud ───── */
function genMap(minElite = 2) {
  const ROWS = 7, on = Array.from({ length: ROWS }, () => [false, false, false]), E = new Set();

    let c = p < 3 ? p : rnd(3);

      let nc = Math.max(0, Math.min(2, c + rnd(3) - 1));
      if (nc !== c && E.has(`${r},${nc}>${c}`)) nc = c;        // two trails never cross
      E.add(`${r},${c}>${nc}`); c = nc;
    }
  }
  const nodes = {};
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < 3; c++) if (on[r][c]) nodes[r * 3 + c] = { id: r * 3 + c, row: r, col: c, jx: rnd(9) - 4, type: 'puzzle', next: [] };
  E.forEach(k => { const [a, b] = k.split('>'), [r, c] = a.split(',').map(Number); nodes[r * 3 + c].next.push((r + 1) * 3 + Number(b)); });
  nodes[21] = { id: 21, row: 7, col: 1, jx: 0, type: 'boss', next: [] };
  const list = Object.values(nodes);
  list.forEach(n => {
    if (n.row === 6) { n.type = 'rest'; n.next = [21]; return; }
    if (n.row < 2 || n.type === 'boss') return;
    const x = Math.random();
    if (x < 0.24) n.type = 'elite'; else if (n.row <= 4 && x < 0.36) n.type = 'gift'; else if (n.row <= 4 && x < 0.47) n.type = 'rest';
  });

}

  const grew = o.t === 'feast' ? buds() : o.k ? [o.k] : [];
  grew.forEach(k => { const b = document.querySelector(`.bud[data-bud="${k}"]:not(.none)`); if (b) b.classList.add('grew'); });
  if (o.t === 'heart' || o.t === 'max') { const h = $('#hearts'); h.classList.remove('hit'); }
}
function chosen(o) { apply(o); closeSheet(); persist(); sfx.reward(); showMap(); gained(o); }
function optHtml(o, i) { const d = describe(o); return `<button class="opt" type="button" style="--i:${i}" data-act="pick" data-i="${i}"><span class="opt-pic">${d.pic}</span><span class="opt-txt"><b>${d.title}</b><span>${d.desc}</span></span></button>`; }
function apply(o) {
  if (o.t === 'buddy') run.bud[o.k] = o.lv;
  else if (o.t === 'snack') run.bud[o.k] = Math.min(3, run.bud[o.k] + o.n);

}
function rewardPool(strong) {

  if (run.hearts < run.max) out.push({ t: 'heart', n: strong ? 9 : 1 });
  if (strong && run.max < 6) out.push({ t: 'max' });
  out.push({ t: 'hint', n: strong ? 4 : 2 });
  if (strong && buds().filter(k => b[k] && b[k] < 3).length >= 2) out.push({ t: 'feast' });
  return shuffle(out).slice(0, 3 + S.meta.perks.clover);
}
function rewardSheet(kind, clean) {
  const strong = kind === 'elite'; let extra = '';
  if (strong && run.hearts < run.max) { run.hearts++; extra = '하트 1개를 회복했어요. '; renderTop(); }
  const bonus = 1 + S.meta.perks.neat;
  if (clean) { run.hints += bonus; extra += `횟수를 넉넉히 남기고 깔끔하게 풀어서 힌트 ${bonus}개를 더 받았어요. `; }
  const opts = rewardPool(strong);
  sheet(`<h2 id="cardTitle">${kind === 'gift' ? '선물 상자를 열었어요' : strong ? '매운맛 스테이지를 깼어요' : '퍼즐을 풀었어요'}</h2><p>${extra}${strong ? '강력한 보상 중 하나를 골라요.' : '보상 중 하나를 골라요.'}</p><div class="opts">${opts.map(optHtml).join('')}</div>`,
    (act, b) => chosen(opts[+b.dataset.i]));
}
function restSheet() {
  const opts = [];
  if (run.hearts < run.max) opts.push({ t: 'heart', n: Math.max(1, 2 - R().restCut + S.meta.perks.mat) });
  buds().forEach(k => { if (run.bud[k] && run.bud[k] < 3) opts.push({ t: 'snack', k, n: 1 }); });
  opts.push({ t: 'hint', n: 2 });
  sheet(`<div class="pic">${svg(ICON.rest)}</div><h2 id="cardTitle">돗자리 쉼터</h2><p>돗자리를 펴고 잠깐 쉬어요. 하나만 고를 수 있어요.</p><div class="opts">${opts.slice(0, 4).map(optHtml).join('')}</div>`,
    (act, b) => chosen(opts[+b.dataset.i]));
}

/* ───── a run ───── */
function newRun() {
  const m = S.meta, st = Math.max(1, Math.min(m.pick || m.reach, m.reach)), r = rulesFor(st), hearts = 3 + m.perks.lunch;
  run = S.run = { stage: st, map: genMap(r.elites), at: null, done: [], hearts, max: hearts, hints: Math.max(0, 2 - r.hintCut + m.perks.lens), bud: { pop: 0, path: 0, sort: 0, rot: 0, flip: 0, cloud: 0 }, shieldUsed: 0, bossStep: 0, bossKinds: shuffle(KINDS.slice()).slice(0, r.rounds), solved: 0 };
  persist(); showMap();
  const picks = shuffle(buds().slice()).slice(0, 3).map(k => ({ t: 'buddy', k, lv: m.perks.pal ? 2 : 1 }));
  sheet(`<div class="pic">${svg(cloudArt(0))}</div><h2 id="cardTitle">소풍을 떠나요</h2><p>먹구름 대왕이 언덕 꼭대기 소풍 자리에 눌러앉았어요. 퍼즐을 풀며 언덕을 올라 먹구름을 걷어 내요.</p>${st > 1 ? `<p>이번 소풍은 ${st}단계 ${STAGES[st - 1].name}이에요. ${STAGES[st - 1].rule} 아래 단계의 규칙도 함께 적용돼요.</p>` : ''}<p>함께 갈 첫 친구를 골라요. 친구마다 도와주는 일이 달라요.</p><div class="opts">${picks.map(optHtml).join('')}</div>`,
    (act, b) => chosen(picks[+b.dataset.i]));
}
function arrive(id) { run.at = id; run.done.push(id); persist(); }
let walking = false;
function enter(id) {
  if (!canGo(id) || walking) return;
  const n = run.map.nodes[id]; sfx.walk();
  walking = true; placeWalker(id);                 // the basket walks there first, then the place opens
  setTimeout(() => {
    walking = false;
    if (n.type === 'rest') { arrive(id); showMap(); restSheet(); }
    else if (n.type === 'gift') { arrive(id); showMap(); rewardSheet('gift'); }
    else if (n.type === 'boss') bossSheet();
    else openPuzzle(n.kind, tierOf(n), { elite: n.type === 'elite', onWin: clean => { arrive(id); run.solved++; rewardSheet(n.type, clean); } });
  }, reduce ? 0 : 320);
}
function bossSheet() {
  const st = run.bossStep, rounds = R().rounds;
  sfx.boss();
  sheet(`<div class="pic">${svg(cloudArt(bossFace(st)))}</div><h2 id="cardTitle">${st === 0 ? '먹구름 대왕을 만났어요' : '먹구름이 옅어졌어요'}</h2><p>${st === 0 ? `소풍 자리 위에 먹구름 대왕이 버티고 있어요. 퍼즐 ${rounds}판을 풀면 구름이 걷혀요.` : `${rounds}판 중 ${st}판을 풀었어요. 조금만 더 하면 해가 나와요.`}</p><p>이번 판은 ${PUZ[run.bossKinds[st]].name}, 난이도 ${bossTier(st) + 1}/10이에요.</p><button class="cta" type="button" data-act="go">${st === 0 ? '도전하기' : '다음 판 하기'}</button>`,
    () => { closeSheet(); openPuzzle(run.bossKinds[st], bossTier(st), { boss: true, onWin: () => { run.bossStep++; run.solved++; persist(); if (run.bossStep >= rounds) victory(); else bossSheet(); } }); });
}
/* the end of a picnic: stamps to keep, and on a win the next rung of the weather ladder */
const afterRun = act => { closeSheet(); if (act === 'book') showBook(); else newRun(); };
function victory() {
  const m = S.meta, st = run.stage || 1, solved = run.solved, friends = buds().filter(k => run.bud[k]).length, firstTime = !m.cleared.includes(st);
  const stamps = solved + 5 + 3 * st + (firstTime ? 5 : 0), news = [];
  if (firstTime) m.cleared.push(st);
  if (st === m.reach && m.reach < STAGES.length) { m.reach++; m.pick = m.reach; news.push(`${m.reach}단계 ${STAGES[m.reach - 1].name}이 열렸어요. ${STAGES[m.reach - 1].rule}`); }
  else if (st === STAGES.length && firstTime) news.push('가장 높은 단계까지 성공했어요.');
  if (!m.cloud) { m.cloud = true; news.push('먹구름 대왕이 마음을 고쳐 구름이가 됐어요. 다음 소풍부터 새 친구로 만날 수 있어요.'); }
  m.stamps += stamps; S.wins++;
  run = S.run = null; persist(); sfx.cheer();
  sheet(`<div class="pic">${svg(cloudArt(3))}</div><h2 id="cardTitle">${st}단계 소풍 성공!</h2><p>먹구름 대왕이 하얀 구름이 되어 웃으며 물러났어요. ${CONFIG.name ? CONFIG.name + '와 ' : ''}친구 ${friends}명이 언덕 꼭대기에 돗자리를 폈어요.</p><p>도장 ${stamps}개를 받아서 모두 ${m.stamps}개가 됐어요.${firstTime ? ' 이 단계를 처음 성공해서 5개가 더 들어 있어요.' : ''}</p>${news.map(t => `<p>${t}</p>`).join('')}<button class="cta" type="button" data-act="book">소풍 수첩에서 준비물 마련하기</button><button class="tool" type="button" data-act="again" style="margin-top:8px">바로 새 소풍 떠나기</button>`, afterRun);
}
function gameOver() {
  const solved = run.solved, m = S.meta; m.stamps += solved;
  run = S.run = null; persist();
  sheet(`<div class="pic">${svg(ICON.rest)}</div><h2 id="cardTitle">오늘은 집으로 돌아가요</h2><p>하트를 다 썼어요. 퍼즐 ${solved}판을 풀어서 도장 ${solved}개를 받았고, 모두 ${m.stamps}개가 됐어요.</p><p>도장으로 준비물을 마련하면 다음 소풍이 조금 수월해져요.</p><button class="cta" type="button" data-act="again">다시 소풍 떠나기</button><button class="tool" type="button" data-act="book" style="margin-top:8px">소풍 수첩 열기</button>`, afterRun);
}

/* ───── running one puzzle ───── */
let cur = null, curArgs = null;
function renderHint() { $('#btnHint').textContent = `힌트 쓰기 (${run.hints}개 남음)`; }
function openPuzzle(kind, tier, ctx) {
  curArgs = [kind, tier, ctx]; show('puzzle'); renderTop();
  $('#pName').textContent = (ctx.elite ? '매운맛 ' : ctx.boss ? '먹구름 대왕의 ' : '') + PUZ[kind].name;
  $('#pRate').textContent = (ctx.boss ? `${run.bossStep + 1}/${R().rounds}판, ` : '') + `난이도 ${Math.min(10, tier + 1)}/10`;
  const board = $('#board'), wrap = $('#boardWrap'); board.innerHTML = ''; $('#pGoal').innerHTML = '';
  wrap.querySelectorAll('.burst').forEach(b => b.remove());
  const lv = run.bud[kind], who = $('#who');
  // whoever is beside you for this puzzle: the cloud for a boss round, otherwise the friend who helps with it
  who.innerHTML = ctx.boss ? svg(cloudArt(bossFace(run.bossStep))) : lv ? buddySvg(kind) : '';
  who.hidden = !(ctx.boss || lv);
  let cheered = false;
  const api = {
    board, w: wrap.clientWidth - 20, h: wrap.clientHeight - 20, squeeze: R().squeeze,
    setGoal: h => { $('#pGoal').innerHTML = h; },
    setLeft: (t, low) => {
      const p = $('#pLeft'); p.textContent = t; p.classList.toggle('low', !!low);
      if (low && !cheered && cur) { cheered = true; api.say(lv ? `${BUD[kind].name}: 얼마 안 남았어요. 천천히 골라 봐요!` : '얼마 안 남았어요. 천천히 골라 봐요.'); }
    },
    say: t => { $('#note').textContent = t; },
    win: clean => endPuzzle(true, clean), lose: () => endPuzzle(false)
  };
  cur = PUZ[kind].make(api, tier, lv);
  api.say(PUZ[kind].how + (ctx.boss ? ' 먹구름 대왕이 지켜보고 있어요.' : lv ? ` ${BUD[kind].name}(Lv${lv})가 도와주고 있어요.` : ''));
  renderHint();
}
/* a quick scatter of candy-coloured dots from the middle of the board when a puzzle is solved */
function burst() {
  if (reduce) return;
  const box = el('div', 'burst'); $('#boardWrap').appendChild(box);
  const colours = ['#FFC02E', '#FF6B9A', '#35C9A0', '#4FA3FF', '#A678FF'];
  for (let i = 0; i < 18; i++) {
    const dot = el('i'), a = Math.PI * 2 * i / 18 + Math.random() * .3, far = 70 + Math.random() * 90;
    dot.style.background = colours[i % 5]; box.appendChild(dot);
    dot.animate([{ transform: 'translate(0,0) scale(1.2)', opacity: 1 }, { transform: `translate(${(Math.cos(a) * far).toFixed(0)}px,${(Math.sin(a) * far).toFixed(0)}px) scale(.5)`, opacity: 0 }], { duration: 300, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'forwards' });
  }
  setTimeout(() => box.remove(), 400);
}
function endPuzzle(won, clean) {
  const [kind, tier, ctx] = curArgs; cur = null;
  if (won) { burst(); $('#note').textContent = run.bud[kind] && !ctx.boss ? `${BUD[kind].name}: 해냈어요!` : '해냈어요!'; }
  setTimeout(() => {
    if (won) { sfx.win(); ctx.onWin(clean); return; }
    const guard = (run.bud.cloud || 0) - (run.shieldUsed || 0);
    if (guard > 0) {              // the cloud friend takes the fall instead of a heart
      run.shieldUsed = (run.shieldUsed || 0) + 1; persist(); sfx.hint();
      sheet(`<div class="pic">${buddySvg('cloud')}</div><h2 id="cardTitle">구름이가 막아 줬어요</h2><p>횟수를 다 썼지만 구름이가 하트를 지켜 줬어요. 이번 소풍에서 ${guard - 1}번 더 지켜 줄 수 있어요. 같은 곳에서 새 판으로 다시 도전해요.</p><button class="cta" type="button" data-act="retry">다시 도전하기</button>`,
        () => { closeSheet(); openPuzzle(kind, tier, ctx); });
      return;
    }
    run.hearts--; persist(); renderTop(); sfx.lose();
    const h = $('#hearts'); h.classList.remove('hit'); void h.offsetWidth; h.classList.add('hit');
    if (run.hearts <= 0) { gameOver(); return; }
    sheet(`<div class="pic">${svg(ICON.heartOff)}</div><h2 id="cardTitle">아쉬워요</h2><p>횟수를 다 써서 하트 1개를 잃었어요. 하트가 ${run.hearts}개 남았어요. 같은 곳에서 새 판으로 다시 도전해요.</p><button class="cta" type="button" data-act="retry">다시 도전하기</button>`,
      () => { closeSheet(); openPuzzle(kind, tier, ctx); });
  }, reduce ? 100 : 650);
}
$('#btnHint').addEventListener('click', () => {
  if (!cur) return;
  if (run.hints <= 0) { sfx.no(); $('#note').textContent = '힌트가 없어요. 보상이나 쉼터에서 얻을 수 있어요.'; return; }
  if (cur.hint()) { run.hints--; persist(); sfx.hint(); renderHint(); }
});

/* ───── controls and start ───── */
const isTopLevel = (() => { try { return window.self === window.parent; } catch (e) { return false; } })();
const isInstalled = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let installEvt = null, newArmed = 0;

function menuSheet() {
  const row = (act, title, desc) => `<button class="opt" type="button" data-act="${act}"><span class="opt-txt"><b>${title}</b><span>${desc}</span></span></button>`;
  const draw = () => sheet(`<h2 id="cardTitle">메뉴</h2><div class="opts">`
    + row('sound', S.muted ? '소리 켜기' : '소리 끄기', `지금은 소리가 ${S.muted ? '꺼져' : '켜져'} 있어요.`)
    + (navigator.vibrate ? row('vib', S.vib ? '진동 끄기' : '진동 켜기', `지금은 진동이 ${S.vib ? '켜져' : '꺼져'} 있어요.`) : '')
    + (screenNow === 'map' ? row('home', '처음 화면으로 가기', '소풍은 저장돼 있어서 이어서 할 수 있어요.') : '')
    + `</div><button class="cta" type="button" data-act="close">닫기</button>`,
    act => {

      else if (act === 'vib') { S.vib = !S.vib; persist(); buzz(20); draw(); }

}
$('#btnMenu').addEventListener('click', menuSheet);
$('#btnSet').addEventListener('click', menuSheet);

  const friends = going ? buds().filter(k => S.run.bud[k]).length : 0, m = S.meta, pick = Math.max(1, Math.min(m.pick || m.reach, m.reach)), on = going ? S.run.stage || 1 : pick;
  $('#titleSub').textContent = (going ? `${on}단계 ${STAGES[on - 1].name} 소풍 중이에요. 친구 ${friends}명, 하트 ${S.run.hearts}개.`
    : S.wins ? `다음 소풍은 ${pick}단계 ${STAGES[pick - 1].name}이에요.` : '퍼즐을 풀며 언덕을 올라, 꼭대기에 눌러앉은 먹구름 대왕을 걷어 내요.')

  const fresh = $('#btnNew'); fresh.className = going ? 'tool' : 'cta'; fresh.textContent = going ? '새 소풍 떠나기' : '소풍 떠나기';
  clearTimeout(newArmed); newArmed = 0;
  const tip = $('#titleTip'), ins = $('#btnInstall');

    : /iPhone|iPad|iPod/.test(navigator.userAgent) ? '사파리의 공유 버튼에서 "홈 화면에 추가"를 누르면 앱처럼 쓸 수 있어요.'
    : '브라우저 메뉴에서 "앱 설치"나 "홈 화면에 추가"를 누르면 앱처럼 쓸 수 있어요.';
}
/* the picnic notebook: pick the weather stage for the next picnic, and spend stamps on things that stay */
function showBook() {

  const m = S.meta;
  $('#stampCount').textContent = `도장 ${m.stamps}개`;
  const stages = STAGES.map((s, i) => {
    const n = i + 1, open = n <= m.reach, done = m.cleared.includes(n), sel = n === m.pick;
    return `<li><button class="stage-row${sel ? ' sel' : ''}" type="button" data-stage="${n}"${open ? '' : ' disabled'}><span class="num">${n}</span><span class="txt"><b>${s.name}</b><span>${s.rule}</span></span><span class="state">${!open ? '잠김' : sel ? '다음 소풍' : done ? '성공함' : '고르기'}</span></button></li>`;
  }).join('');
  const perks = PERKS.map(p => {
    const lv = m.perks[p.id], max = p.costs.length, full = lv >= max, cost = p.costs[lv], lack = full ? 0 : cost - m.stamps;
    return `<li class="perk"><div class="txt"><b>${p.name}${max > 1 ? ` ${lv}/${max}` : ''}</b><span>${p.desc(full ? lv : lv + 1)}</span></div>`
      + (full ? '<span class="state">마련했어요</span>' : `<button class="buy" type="button" data-perk="${p.id}"${lack > 0 ? ' aria-disabled="true"' : ''}>${lack > 0 ? `도장 ${cost}개 필요` : `도장 ${cost}개로 마련하기`}</button>`) + '</li>';
  }).join('');
  $('#bookBody').innerHTML = `<h3>날씨 단계</h3><p class="book-sub">소풍에 성공하면 다음 단계가 열려요. 높은 단계일수록 도장을 더 받고, 아래 단계의 규칙도 모두 함께 적용돼요.</p><ol class="stages">${stages}</ol>`
    + `<h3>준비물</h3><p class="book-sub">도장으로 마련하면 다음 소풍부터 계속 적용돼요.${S.run ? ' 지금 하고 있는 소풍에는 적용되지 않아요.' : ''}</p><ul class="perks">${perks}</ul>`
    + `<h3>친구</h3><p class="book-sub">${m.cloud ? '구름이까지 여섯 친구를 소풍에서 만날 수 있어요.' : '첫 소풍에 성공하면 여섯 번째 친구가 생겨요.'}</p>`;
}
$('#bookBody').addEventListener('click', e => {
  const m = S.meta, row = e.target.closest('.stage-row'), buy = e.target.closest('.buy');

  if (buy) {
    const p = PERKS.find(x => x.id === buy.dataset.perk), cost = p.costs[m.perks[p.id]];
    if (cost == null || m.stamps < cost) { sfx.no(); return; }

  }
});
$('#btnBook').addEventListener('click', () => { sfx.select(); showBook(); });
$('#btnBookBack').addEventListener('click', showTitle);
$('#btnContinue').addEventListener('click', () => { run = S.run; sfx.walk(); showMap(); });
$('#btnNew').addEventListener('click', () => {
  const b = $('#btnNew'), going = !$('#btnContinue').hidden;
  if (going && !newArmed) {       // a run is in progress: ask once more, on the button itself
    b.textContent = '한 번 더 누르면 지금 소풍을 버리고 새로 떠나요';
    newArmed = setTimeout(() => { newArmed = 0; b.textContent = '새 소풍 떠나기'; }, 3000);
    return;
  }
  clearTimeout(newArmed); newArmed = 0; sfx.walk(); newRun();
});
$('#btnInstall').addEventListener('click', () => { if (!installEvt) return; installEvt.prompt(); installEvt = null; $('#btnInstall').hidden = true; });
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (screenNow === 'title') showTitle(); });
/* as an installed app: keep a copy on the phone so it opens without a connection */
if (isTopLevel && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
document.addEventListener('gesturestart', e => e.preventDefault());
if (window.ResizeObserver) new ResizeObserver(() => { if (screenNow === 'map' && run) placeWalker(run.at); }).observe($('#map'));

showTitle();
</script>
