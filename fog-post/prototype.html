<title>안개 우체국</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gaegu:wght@400;700&display=swap">
<style>
/* 안개 낀 밤의 우체국: 무대는 흐린 청회색 안개, 손에 쥔 카드는 종이 우표, 포인트는 우체통 빨강. 한 가지 분위기로 고정한 디자인이라 밝은/어두운 테마를 따로 두지 않음 */
:root{
  --night:#17232b; --fog:#263843; --fog-2:#3a5260; --mist:#bccbd1; --mist-dim:#7f97a1;
  --paper:#f2eadb; --paper-2:#e4d7bf; --ink:#2b2520; --ink-soft:#6b5f52;
  --red:#cf3f35; --red-dark:#9e2c25; --blue:#2f5f8c; --gold:#e3b04b; --green:#6aa57a;
  --f-display:'Jua','Gowun Dodum',system-ui,sans-serif;
  --f-body:'Gowun Dodum',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-hand:'Gaegu','Gowun Dodum',cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--mist);font-family:var(--f-body);overflow:hidden;font-size:15px}
body::before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;
  background:
    radial-gradient(40% 30% at 20% 30%, rgba(188,203,209,.10), transparent 70%),
    radial-gradient(35% 25% at 80% 60%, rgba(188,203,209,.08), transparent 70%),
    radial-gradient(50% 35% at 50% 100%, rgba(58,82,96,.6), transparent 70%);
  animation:fogdrift 28s ease-in-out infinite alternate}
@keyframes fogdrift{to{transform:translate(4%,-3%) scale(1.05)}}
#app{position:relative;z-index:1;height:100%;overflow-y:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn{background:var(--red);color:var(--paper);border:0;border-radius:10px;padding:12px 22px;font-family:var(--f-display);font-size:18px;box-shadow:0 3px 0 var(--red-dark)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red-dark)}
.btn.ghost{background:transparent;color:var(--mist);box-shadow:inset 0 0 0 2px var(--fog-2)}
.btn[disabled]{opacity:.45;cursor:default}

/* ---------- 제목 ---------- */
.title{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding-block:32px}
.title h1{font-family:var(--f-display);font-weight:400;font-size:clamp(44px,9vw,84px);margin:0;color:var(--paper);letter-spacing:.02em;text-shadow:0 0 30px rgba(188,203,209,.35)}
.title .sub{max-width:34em;line-height:1.7;color:var(--mist);margin:0;text-wrap:balance}
.title .otter-big{width:min(180px,40vw)}
.diff{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.diff span{font-size:14px;color:var(--mist-dim)}
.chip{border:2px solid var(--fog-2);background:transparent;border-radius:999px;padding:6px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.note{font-size:13px;color:var(--mist-dim)}

/* ---------- 대화 ---------- */
.dialog{min-height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-block:24px 40px;gap:16px;cursor:pointer}
.dialog .scene{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
.dialog .scene svg{width:min(220px,46vw)}
.dbox{width:min(720px,100%);background:rgba(23,35,43,.88);border:2px solid var(--fog-2);border-radius:14px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;min-height:120px}
.dbox .face{width:64px;height:64px;flex:none;border-radius:50%;background:var(--fog);display:grid;place-items:center;overflow:hidden}
.dbox .face svg{width:58px;height:58px}
.dbox .who{font-family:var(--f-display);color:var(--gold);font-size:16px;margin-bottom:4px}
.dbox .txt{line-height:1.7;font-size:17px;color:var(--paper);min-width:0}
.dbox.narr{justify-content:center;text-align:center}
.dbox.narr .txt{color:var(--mist);font-style:normal}
.dnext{font-size:13px;color:var(--mist-dim)}

/* ---------- 전투 ---------- */
.battle{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px;padding-block:10px;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bag{display:flex;align-items:center;gap:8px;min-width:0}
.bag b{font-family:var(--f-display);font-weight:400;color:var(--paper)}
.bar{position:relative;width:min(220px,38vw);height:14px;border-radius:7px;background:var(--fog);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--red);border-radius:7px;transition:width .35s ease}
.bar.mist i{background:var(--mist)}
.bar em{position:absolute;inset:0;font-style:normal;font-size:11px;line-height:14px;text-align:center;color:var(--paper);text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.route{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mist-dim)}
.env{width:22px;height:15px;border-radius:2px;border:1.5px solid var(--mist-dim);position:relative}
.env::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 48%,var(--mist-dim) 49%,var(--mist-dim) 52%,transparent 53%) left/50% 100% no-repeat,linear-gradient(to bottom left,transparent 48%,var(--mist-dim) 49%,var(--mist-dim) 52%,transparent 53%) right/50% 100% no-repeat;height:60%}
.env.done{background:var(--paper);border-color:var(--paper)}
.env.done::after{display:none}
.env.now{border-color:var(--gold);box-shadow:0 0 8px var(--gold)}

.stage{display:grid;grid-template-columns:1fr minmax(240px,420px) 1fr;grid-template-areas:"player letter enemy";align-items:center;gap:16px;min-height:0}
.actor{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;min-width:0}
.player{grid-area:player}.enemy{grid-area:enemy}
.otter{width:min(150px,28vw)}
.shield{display:inline-flex;align-items:center;gap:4px;background:var(--blue);color:var(--paper);border-radius:8px;padding:2px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.statusrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:22px}
.st{font-size:12px;border-radius:6px;padding:2px 7px;background:var(--fog);color:var(--paper);cursor:help}
.st.vuln{background:#7a4b2a}.st.weak{background:#4b4f7a}.st.str{background:#7a2f2f}.st.craft{background:#3f6a4a}

.intent{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--paper);color:var(--ink);border-radius:12px;padding:6px 12px;position:relative;min-width:96px;text-align:center}
.intent::after{content:"";position:absolute;bottom:-7px;left:50%;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--paper)}
.intent .what{font-family:var(--f-display);font-size:17px;line-height:1.1}
.intent .what.atk{color:var(--red)}
.intent .lab{font-size:11px;color:var(--ink-soft)}
.ename{font-family:var(--f-display);color:var(--paper);font-size:18px;text-align:center}

.fogmon{position:relative;width:min(190px,34vw);aspect-ratio:1;transition:opacity .5s}
.fogmon.boss{width:min(240px,40vw)}
.fogmon .blob{position:absolute;border-radius:50%;background:radial-gradient(circle at 45% 40%,var(--tint) 0%,color-mix(in srgb,var(--tint) 60%,transparent) 45%,transparent 70%);filter:blur(5px);animation:wob 5s ease-in-out infinite alternate}
.fogmon .b1{inset:8% 10% 10% 8%}
.fogmon .b2{inset:24% 0 18% 34%;animation-duration:6.5s;animation-delay:-2s}
.fogmon .b3{inset:30% 38% 6% 0;animation-duration:7.5s;animation-delay:-4s}
@keyframes wob{to{transform:translate(4%,-5%) scale(1.06)}}
.fogmon .eyes{position:absolute;left:30%;right:30%;top:40%;display:flex;justify-content:space-between;animation:look 4s ease-in-out infinite}
.fogmon .eyes i{width:18%;aspect-ratio:.75;background:#fff;border-radius:50%;position:relative;animation:blink 5s infinite}
.fogmon .eyes i::after{content:"";position:absolute;width:50%;height:50%;left:25%;top:34%;background:#1a1e24;border-radius:50%}
.fogmon .mouth{position:absolute;left:44%;right:44%;top:58%;height:6%;border-bottom:3px solid rgba(26,30,36,.7);border-radius:0 0 50% 50%}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes look{0%,100%{transform:translateX(0)}50%{transform:translateX(6%)}}
.hit{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.lunge{animation:lunge .4s}
@keyframes lunge{40%{transform:translateX(-30px) scale(1.08)}}

.letter{grid-area:letter;background:var(--paper);color:var(--ink);border-radius:4px;padding:14px 18px 16px;box-shadow:0 10px 30px rgba(0,0,0,.4);position:relative;max-height:100%;overflow:auto;
  background-image:repeating-linear-gradient(to bottom,transparent 0 29px,rgba(47,95,140,.16) 29px 30px);background-position:0 46px}
.letter .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-soft);margin-bottom:6px;flex-wrap:wrap}
.letter ol{list-style:none;margin:0;padding:0;font-family:var(--f-hand);font-size:20px;line-height:30px}
.letter li{transition:filter .6s,opacity .6s}
.letter li.hid{filter:blur(5px);opacity:.55;user-select:none}
.letter li.fresh{animation:reveal 1s ease}
@keyframes reveal{from{filter:blur(6px);opacity:.4;background:rgba(227,176,75,.35)}to{filter:none;opacity:1;background:transparent}}
.letter.child ol{font-size:22px;color:#3a3a6a}
.letter .stampmark{position:absolute;right:12px;top:10px;width:34px;height:42px;background:var(--red);opacity:.85;transform:rotate(4deg);outline:2px dashed var(--paper);outline-offset:-5px}
.hint{font-size:13px;color:var(--gold);text-align:center;margin-top:6px}

.bottom{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:14px;padding-bottom:22px}
.energy{width:64px;height:64px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:22px;box-shadow:inset 0 0 0 4px rgba(43,37,32,.25),0 0 18px rgba(227,176,75,.35);font-variant-numeric:tabular-nums}
.energy.empty{background:var(--fog-2);color:var(--mist);box-shadow:none}
.energy.flash{animation:shake .3s}
.piles{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mist-dim);align-items:center}
.hand{display:flex;justify-content:center;align-items:flex-end;min-height:160px;padding-top:14px}
.hand .card{margin-inline:4px}
.endturn{display:flex;flex-direction:column;gap:8px;align-items:center}

/* ---------- 카드 (우표 모양) ---------- */
.card{--band:var(--red);position:relative;width:clamp(66px,15vw,118px);aspect-ratio:3/4.1;background:var(--paper);color:var(--ink);border:0;border-radius:2px;padding:0;
  display:flex;flex-direction:column;align-items:stretch;text-align:center;transition:transform .15s ease,opacity .2s;flex:none}
.card::before{content:"";position:absolute;inset:-5px;z-index:-1;background:radial-gradient(circle,transparent 3px,var(--paper) 3.5px) -5px -5px/10px 10px}
.card .band{height:20%;background:var(--band);display:flex;align-items:center;justify-content:center;margin:6px 6px 0}
.card .band svg{height:70%;width:auto}
.card .cost{position:absolute;left:-8px;top:-8px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--gold);font-family:var(--f-display);font-size:16px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--paper)}
.card .nm{font-family:var(--f-display);font-size:clamp(11px,2.3vw,15px);line-height:1.15;padding:6px 4px 2px;text-wrap:balance}
.card .ds{font-size:clamp(10px,1.9vw,12.5px);line-height:1.35;padding:0 5px 6px;color:var(--ink-soft);white-space:pre-line;flex:1;display:flex;align-items:center;justify-content:center}
.card .ds b{color:var(--ink)}
.card .ds b.up{color:var(--green)}
.card.t-def{--band:var(--blue)}.card.t-skill{--band:var(--gold)}.card.t-power{--band:var(--green)}
.hand .card:hover:not(.no),.hand .card:focus-visible{transform:translateY(-18px) scale(1.06);z-index:2}
.card.no{opacity:.5;cursor:default}
.card .key{position:absolute;bottom:-18px;left:0;right:0;font-size:11px;color:var(--mist-dim)}
.picks .card{width:clamp(100px,26vw,150px)}
.picks .card:hover{transform:translateY(-8px)}

.float{position:fixed;pointer-events:none;font-family:var(--f-display);font-size:28px;z-index:50;animation:floatup .9s ease-out forwards;text-shadow:0 2px 4px rgba(0,0,0,.6)}
.float.dmg{color:#fff}.float.hurt{color:#ff8a7a}.float.blk{color:#9cc7f0}.float.buff{color:var(--gold);font-size:18px}
@keyframes floatup{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-60px);opacity:0}}
.quip{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:var(--paper);color:var(--ink);font-size:12px;border-radius:8px;padding:4px 8px;white-space:nowrap;animation:floatup 1.6s ease-out forwards}

/* ---------- 배달 완료 / 보상 / 쉼터 / 끝 ---------- */
.page{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-block:28px;text-align:center}
.page h2{font-family:var(--f-display);font-weight:400;color:var(--paper);font-size:clamp(26px,5vw,36px);margin:0}
.page p{margin:0;line-height:1.7;max-width:36em}
.paper{position:relative;width:min(560px,100%);background:var(--paper);color:var(--ink);text-align:left;padding:20px 24px 22px;border-radius:4px;box-shadow:0 12px 34px rgba(0,0,0,.45);
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(47,95,140,.16) 31px 32px);background-position:0 54px}
.paper .meta{font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.paper .body{font-family:var(--f-hand);font-size:21px;line-height:32px}
.paper.child .body{font-size:23px;color:#3a3a6a}
.reply{margin-top:14px;padding-top:12px;border-top:1px dashed var(--ink-soft);font-family:var(--f-hand);font-size:20px;line-height:30px;color:var(--blue)}
.reply small{display:block;font-family:var(--f-body);font-size:12px;color:var(--ink-soft)}
.postmark{position:absolute;right:14px;top:14px;width:96px;height:96px;border:3px solid var(--red);border-radius:50%;color:var(--red);display:grid;place-items:center;font-family:var(--f-display);font-size:17px;transform:rotate(-14deg);opacity:.85;animation:stampin .45s cubic-bezier(.3,1.6,.6,1)}
.postmark::before{content:"";position:absolute;inset:6px;border:1.5px solid var(--red);border-radius:50%}
@keyframes stampin{from{transform:rotate(-14deg) scale(2.2);opacity:0}}
.badge{display:inline-block;background:var(--green);color:var(--paper);border-radius:999px;padding:4px 12px;font-size:14px}
.pline{display:flex;gap:10px;align-items:center;width:min(560px,100%);text-align:left;background:rgba(23,35,43,.8);border:1.5px solid var(--fog-2);border-radius:12px;padding:10px 12px}
.pline svg{width:42px;height:42px;flex:none}
.picks{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;padding:10px}
.opts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.decklist{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:820px;padding:8px}
.decklist .card{width:clamp(70px,16vw,100px)}
.stats{display:flex;gap:18px;font-size:14px;color:var(--mist-dim);flex-wrap:wrap;justify-content:center}

@media (max-width:760px){
  body{font-size:14px}
  .stage{grid-template-columns:1fr 1fr;grid-template-areas:"letter letter" "player enemy";gap:8px;align-content:center}
  .letter{max-height:32vh;padding:10px 14px}
  .letter ol{font-size:17px;line-height:26px}
  .letter{background-size:auto;background-image:repeating-linear-gradient(to bottom,transparent 0 25px,rgba(47,95,140,.16) 25px 26px);background-position:0 36px}
  .otter{width:min(110px,28vw)}
  .bottom{grid-template-columns:auto 1fr auto;grid-template-areas:"hand hand hand" "energy piles end";align-items:center;gap:8px}
  .hand{grid-area:hand;min-height:130px}
  .energyWrap{grid-area:energy}.piles{grid-area:piles}.endturn{grid-area:end}
  .energy{width:52px;height:52px;font-size:19px}
  .card .cost{width:22px;height:22px;font-size:13px;left:-6px;top:-6px}
  .hand .card{margin-inline:1px}
  .bottom{padding-bottom:8px}
  .card .key{display:none}
  .btn{padding:10px 16px;font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<div id="app"></div>

<script>
'use strict';
/* ================= 데이터 ================= */
const CARDS = {
  stamp:     {name:'우표 붙이기',     cost:1, type:'atk',   dmg:6},
  envelope:  {name:'봉투 접기',       cost:1, type:'def',   block:5},
  redseal:   {name:'빨간 도장',       cost:2, type:'atk',   dmg:8, vuln:2},
  postcard:  {name:'엽서 연타',       cost:1, type:'atk',   dmg:3, hits:2},
  express:   {name:'속달 우표',       cost:0, type:'atk',   dmg:4},
  parcel:    {name:'두꺼운 소포',     cost:2, type:'def',   block:12},
  bubble:    {name:'뽁뽁이',          cost:1, type:'def',   block:6, draw:1},
  wax:       {name:'밀랍 봉인',       cost:1, type:'atk',   dmg:5, weak:2},
  zipcode:   {name:'우편번호 확인',   cost:0, type:'skill', vuln:1, draw:1},
  postmark:  {name:'소인 쾅쾅',       cost:2, type:'atk',   dmg:4, hits:3},
  pigeon:    {name:'비둘기 선배 호출', cost:2, type:'atk',   dmg:14, quip:true},
  registered:{name:'빠른 등기',       cost:1, type:'skill', draw:2},
  craft:     {name:'수달 손재주',     cost:1, type:'power', str:2, exhaust:true},
  tea:       {name:'따뜻한 보리차',   cost:0, type:'skill', energy:1, draw:1, exhaust:true},
  reply:     {name:'답장 쓰기',       cost:1, type:'atk',   bodyslam:true},
  postbox:   {name:'우체통 뒤에 숨기', cost:1, type:'def',   block:5, weak:1},
};
const POOL = ['postcard','express','parcel','bubble','wax','zipcode','postmark','pigeon','registered','craft','tea','reply','postbox'];
const START_DECK = ['stamp','stamp','stamp','stamp','stamp','envelope','envelope','envelope','envelope','redseal'];
const KEYWORDS = {
  vuln:'주소 찾음: 받는 피해가 50% 늘어나요.',
  weak:'봉인: 주는 피해가 25% 줄어들어요.',
  str:'힘: 공격 피해가 그만큼 늘어나요.',
  craft:'손재주: 수달의 공격 피해가 그만큼 늘어나요.',
};

const ENEMIES = {
  pretend:{name:'괜찮은 척', hp:34, tint:'#9fb7c9',
    pattern:t=>[{atk:7,label:'애써 웃기'},{atk:4,block:6,label:'괜찮다니까'},{atk:9,label:'울컥'}][t%3]},
  typo:{name:'오타 괴물', hp:38, tint:'#d1b88c',
    pattern:()=>pick([{atk:3,hits:2,label:'물 5500ml'},{atk:11,label:'스프 통째로 투척'},{atk:4,block:8,label:'면 불리기'},{atk:7,label:'계란 마구 풀기'}])},
  shy:{name:'부끄러움', hp:42, tint:'#e3a3ad',
    pattern:t=>t%2===0?{block:12,str:2,label:'얼굴 가리기'}:{atk:10,label:'불쑥!'}},
  later:{name:'나중에 말해야지', hp:76, tint:'#8f92c4', boss:true,
    pattern:t=>[{str:2,label:'내일 말하지 뭐'},{atk:6,hits:2,label:'괜히 투덜'},{str:2,block:10,label:'다음에 하지 뭐'},{atk:16,label:'한꺼번에 몰려옴'}][t%4]},

function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function newRun(easy){

function startBattle(){
  const L = LETTERS[S.li], def = ENEMIES[L.enemy];
  S.screen='battle';
  S.b = {enemy:{key:L.enemy, hp:def.hp, max:def.hp, block:0, str:0, weak:0, vuln:0, intent:null},
         draw:shuffle(S.deck), hand:[], discard:[], exhaust:[], energy:3, block:0, str:0, turn:0, took:false, shown:1};
  busy=false;
  renderBattleShell();
  startTurn();
}
function startTurn(){
  const b=S.b, e=b.enemy;
  b.block=0; b.energy=3;
  e.intent = ENEMIES[e.key].pattern(b.turn);
  drawCards(5);
  updateBattle();
}
function drawCards(n){
  const b=S.b;
  for(let k=0;k<n;k++){
    if(!b.draw.length){ if(!b.discard.length) break; b.draw=shuffle(b.discard); b.discard=[]; }
    if(b.hand.length>=10) break;
    b.hand.push(b.draw.pop());
  }
}
function dmgToEnemy(base){
  const b=S.b; let d=base+b.str; if(b.enemy.vuln>0) d=Math.floor(d*1.5); return Math.max(0,d);
}
function dmgToPlayer(base){
  const e=S.b.enemy; let d=base+e.str; if(e.weak>0) d=Math.floor(d*.75); if(S.easy) d=Math.floor(d*.75); return Math.max(0,d);
}
function hitEnemy(d){
  const e=S.b.enemy; const absorbed=Math.min(e.block,d); e.block-=absorbed; const rest=d-absorbed; e.hp=Math.max(0,e.hp-rest);
  floatAt('enemyMon', rest>0?String(rest):'막힘', rest>0?'dmg':'blk'); anim('enemyMon','hit');
}
function hitPlayer(d){
  const b=S.b; const absorbed=Math.min(b.block,d); b.block-=absorbed; const rest=d-absorbed;
  if(rest>0){ S.hp=Math.max(0,S.hp-rest); b.took=true; floatAt('playerArt','-'+rest,'hurt'); anim('playerArt','hit'); }
  else floatAt('playerArt','막음','blk');
}
function playCard(i){
  if(busy||!S.b) return;
  const b=S.b, e=b.enemy, id=b.hand[i]; if(!id) return;
  const c=CARDS[id];
  if(c.cost>b.energy){ anim('energy','flash'); return; }
  b.energy-=c.cost; b.hand.splice(i,1);
  if(c.energy) b.energy+=c.energy;
  if(c.str){ b.str+=c.str; floatAt('playerArt','손재주 +'+c.str,'buff'); }
  if(c.block){ b.block+=c.block; floatAt('playerArt','+'+c.block,'blk'); }
  if(c.dmg){ const hits=c.hits||1; for(let h=0;h<hits;h++){ if(e.hp>0) hitEnemy(dmgToEnemy(c.dmg)); } }
  if(c.bodyslam){ let d=b.block; if(e.vuln>0) d=Math.floor(d*1.5); hitEnemy(d); }
  if(c.vuln) e.vuln+=c.vuln;
  if(c.weak) e.weak+=c.weak;
  if(c.draw) drawCards(c.draw);
  (c.exhaust?b.exhaust:b.discard).push(id);
  if(c.quip) quip(pick(QUIPS));
  updateBattle();
  if(e.hp<=0) winBattle();
}
function endTurn(){
  if(busy||!S.b) return;
  busy=true;
  const b=S.b, e=b.enemy;
  b.discard.push(...b.hand); b.hand=[];
  updateBattle();
  setTimeout(()=>{
    const it=e.intent;
    e.block=0;
    if(it.block){ e.block+=it.block; floatAt('enemyMon','+'+it.block,'blk'); }
    if(it.str){ e.str+=it.str; floatAt('enemyMon','힘 +'+it.str,'buff'); }
    if(it.atk){ anim('enemyMon','lunge'); const hits=it.hits||1; for(let h=0;h<hits;h++) hitPlayer(dmgToPlayer(it.atk)); }
    if(e.weak>0) e.weak--; if(e.vuln>0) e.vuln--;
    updateBattle();
    if(S.hp<=0){ setTimeout(()=>{ S.screen='gameover'; S.b=null; busy=false; render(); },700); return; }
    setTimeout(()=>{ b.turn++; S.stats.turns++; busy=false; startTurn(); },450);
  },350);
}
function winBattle(){
  busy=true;
  const b=S.b;
  S.stats.turns++;
  S.lastClean=!b.took;
  if(!b.took){ S.stats.clean++; S.hp=Math.min(S.maxHp,S.hp+6); }
  setTimeout(()=>{ S.b=null; busy=false; S.screen = LETTERS[S.li].enemy==='later' ? 'ending' : 'delivered'; render(); },800);
}

  const s=S.screen;
  if(s==='title') return renderTitle();
  if(s==='dialog') return renderDialog();
  if(s==='battle'){ if(!S.b){ startBattle(); return; } renderBattleShell(); updateBattle(); return; }
  if(s==='delivered') return renderDelivered();
  if(s==='reward') return renderReward();
  if(s==='rest') return renderRest();
  if(s==='ending') return renderEnding();
  if(s==='gameover') return renderGameover();
}

function cardDesc(id,inBattle){
  const c=CARDS[id], p=[];
  if(c.dmg){ const v=inBattle?dmgToEnemy(c.dmg):c.dmg; p.push(`피해 <b class="${v>c.dmg?'up':''}">${v}</b>${c.hits>1?' × '+c.hits:''}`); }
  if(c.bodyslam) p.push('지금 방어만큼 피해');
  if(c.block) p.push(`방어 <b>${c.block}</b>`);
  if(c.vuln) p.push(`주소 찾음 ${c.vuln}`);
  if(c.weak) p.push(`봉인 ${c.weak}`);
  if(c.energy) p.push(`에너지 +${c.energy}`);
  if(c.draw) p.push(`카드 ${c.draw}장 뽑기`);
  if(c.str) p.push(`이번 배달 동안\n손재주 +${c.str}`);
  if(c.exhaust) p.push('(한 번만)');
  return p.join('\n');
}

  const c=CARDS[id];
  const tip=[c.vuln&&KEYWORDS.vuln,c.weak&&KEYWORDS.weak,c.str&&KEYWORDS.craft].filter(Boolean).join(' ');
  return `<button class="card t-${c.type}${opts.no?' no':''}" data-i="${i}" ${tip?`title="${esc(tip)}"`:''} aria-label="${esc(c.name)}, 에너지 ${c.cost}">
    <span class="cost">${c.cost}</span>
    <span class="band">${ICONS[c.type]}</span>
    <span class="nm">${esc(c.name)}</span>
    <span class="ds">${cardDesc(id,!!opts.battle)}</span>
    ${opts.key?`<span class="key">${opts.key}</span>`:''}
  </button>`;
}
function intentHTML(e){
  const it=e.intent; if(!it) return '';
  const parts=[];
  if(it.atk){ const d=dmgToPlayer(it.atk); parts.push(`<span class="what atk">공격 ${d}${it.hits>1?' × '+it.hits:''}</span>`); }
  const extra=[]; if(it.block) extra.push('방어'); if(it.str) extra.push('힘 ↑');
  if(extra.length) parts.push(`<span class="what">${extra.join(' · ')}</span>`);
  return parts.join('')+`<span class="lab">${esc(it.label)}</span>`;
}
function statusHTML(list){ return list.filter(x=>x.n>0).map(x=>`<span class="st ${x.cls}" title="${esc(KEYWORDS[x.k])}">${x.name} ${x.n}</span>`).join(''); }
function updateBattle(){
  const b=S.b; if(!b) return;
  const e=b.enemy, L=LETTERS[S.li];
  const q=id=>document.getElementById(id);
  q('hpBar').querySelector('i').style.width=(100*S.hp/S.maxHp)+'%';
  q('hpBar').querySelector('em').textContent=`${S.hp} / ${S.maxHp}`;
  q('eBar').querySelector('i').style.width=(100*e.hp/e.max)+'%';
  q('eBar').querySelector('em').textContent=`안개 ${e.hp} / ${e.max}${e.block?`  ·  방어 ${e.block}`:''}`;
  q('pBlock').innerHTML=b.block?`<span class="shield">방어 ${b.block}</span>`:'';
  q('pStatus').innerHTML=statusHTML([{k:'craft',cls:'craft',name:'손재주',n:b.str}]);
  q('eStatus').innerHTML=statusHTML([{k:'vuln',cls:'vuln',name:'주소 찾음',n:e.vuln},{k:'weak',cls:'weak',name:'봉인',n:e.weak},{k:'str',cls:'str',name:'힘',n:e.str}]);
  q('intent').innerHTML=intentHTML(e);
  q('intent').style.visibility = busy?'hidden':'visible';
  q('enemyMon').style.opacity = (0.35+0.65*e.hp/e.max).toFixed(2);
  const en=q('energy'); en.textContent=`${b.energy}/3`; en.classList.toggle('empty',b.energy===0);
  q('piles').innerHTML=`<span>뽑을 카드 ${b.draw.length}</span><span>버린 카드 ${b.discard.length}</span>`;
  q('hand').innerHTML=b.hand.map((id,i)=>cardHTML(id,i,{battle:true,no:CARDS[id].cost>b.energy||busy,key:i<9?String(i+1):''})).join('');
  q('endBtn').disabled=busy;
  // 편지 줄 공개
  const n=L.lines.length, frac=1-e.hp/e.max, shown=Math.min(n,1+Math.floor(frac*n));
  const prev=b.shown; b.shown=Math.max(prev,shown);
  q('lines').innerHTML=L.lines.map((t,i)=>`<li class="${i>=b.shown?'hid':(i>=prev&&i<b.shown&&prev!==b.shown?'fresh':'')}">${esc(t)}</li>`).join('')
    + (S.li===0&&b.turn===0?`<li class="hint" style="font-family:var(--f-body);font-size:13px;line-height:1.5">카드를 눌러서 쓰세요. 안개 위 말풍선이 다음 행동이에요. 안개를 걷어낼수록 편지가 보여요.</li>`:'');
}
function renderDelivered(){
  const L=LETTERS[S.li];
  $app.innerHTML=`<section class="page">
    <h2>배달 완료</h2>
    ${S.lastClean?'<span class="badge">깨끗한 배달! 가방 +6</span>':''}
    <article class="paper">
      <div class="postmark">배달<br>완료</div>
      <div class="meta"><span>${esc(L.to)}</span></div>
      <div class="body">${L.lines.map(esc).join('<br>')}</div>
      <div class="meta" style="margin-top:8px"><span>${esc(L.from)}</span></div>
      ${L.reply?`<div class="reply"><small>${esc(L.reply.who)}</small>${esc(L.reply.text)}</div>`:''}
    </article>
    ${L.after?`<div class="pline">${PIGEON_SVG}<span>${esc(L.after)}</span></div>`:''}
    <button class="btn" id="nextBtn">다음</button>
  </section>`;
  const nb=document.getElementById('nextBtn'); nb.onclick=()=>{S.screen='reward';S.offer=null;render()}; nb.focus({preventScroll:true});
}
function renderReward(){
  if(!S.offer) S.offer=shuffle(POOL).slice(0,3);
  $app.innerHTML=`<section class="page">
    <h2>우체국 선물</h2>
    <p>카드 한 장을 골라 덱에 넣으세요.</p>
    <div class="picks" id="picks">${S.offer.map((id,i)=>cardHTML(id,i)).join('')}</div>
    <button class="btn ghost" id="skipBtn">안 받고 넘어가기</button>
    <p class="note">지금 덱: ${S.deck.length}장</p>
  </section>`;
  document.getElementById('picks').onclick=ev=>{const c=ev.target.closest('.card'); if(!c) return; S.deck.push(S.offer[+c.dataset.i]); goRest();};
  document.getElementById('skipBtn').onclick=goRest;
}
function goRest(){ S.screen='rest'; S.removing=false; render(); }
function renderRest(){
  if(S.removing){
    $app.innerHTML=`<section class="page">
      <h2>카드 한 장 빼기</h2>
      <p>덱에서 뺄 카드를 고르세요. 덱이 얇을수록 좋은 카드가 자주 나와요.</p>
      <div class="decklist" id="deck">${S.deck.map((id,i)=>cardHTML(id,i)).join('')}</div>
      <button class="btn ghost" id="backBtn">돌아가기</button>
    </section>`;
    document.getElementById('deck').onclick=ev=>{const c=ev.target.closest('.card'); if(!c) return; S.deck.splice(+c.dataset.i,1); afterRest();};
    document.getElementById('backBtn').onclick=()=>{S.removing=false;render()};
    return;
  }
  $app.innerHTML=`<section class="page">
    <h2>길가의 작은 쉼터</h2>
    <p>우편 가방 ${S.hp} / ${S.maxHp}. 다음 편지를 들고 가기 전에 하나만 할 수 있어요.</p>
    <div class="opts">
      <button class="btn" id="sewBtn">가방 꿰매기 (가방 +12)</button>
      <button class="btn" id="rmBtn" ${S.deck.length<=6?'disabled':''}>카드 한 장 빼기</button>
    </div>
    <button class="btn ghost" id="passBtn">그냥 지나가기</button>
  </section>`;
  document.getElementById('sewBtn').onclick=()=>{S.hp=Math.min(S.maxHp,S.hp+12); afterRest();};
  document.getElementById('rmBtn').onclick=()=>{S.removing=true;render()};
  document.getElementById('passBtn').onclick=afterRest;
}
function afterRest(){
  S.li++; S.removing=false;
  if(LETTERS[S.li].enemy==='later'){ S.screen='dialog'; S.dlg=BEFORE_BOSS; S.di=0; S.next='battle'; }
  else S.screen='battle';
  render();
}
function renderEnding(){
  const L=LETTERS[S.li];
  $app.innerHTML=`<section class="page">
    <h2>안개가 걷혔다</h2>
    <article class="paper child">
      <div class="meta"><span>${esc(L.to)}</span></div>
      <div class="body">${L.lines.map(esc).join('<br>')}</div>
      <div class="meta" style="margin-top:8px"><span>${esc(L.from)}</span></div>
    </article>
    <p>받는 사람 칸의 번진 글씨가 아주 조금 선명해졌다.<br><b style="font-family:var(--f-hand);font-size:22px;color:var(--paper)">“내 동생 ㅊ…”</b></p>
    <p>수달은 편지를 가방 깊숙이 다시 넣었다. 아직 이 편지를 전할 주소를 모른다.</p>
    <div class="pline">${PIGEON_SVG}<span>나중에 말하자고 미루면, 결국 안개가 되는 거야. 신입, 이 편지는 꼭 배달하자.</span></div>
    <p class="note">1장 끝 · 프로토타입은 여기까지예요</p>
    <div class="stats"><span>쓴 턴 ${S.stats.turns}</span><span>깨끗한 배달 ${S.stats.clean}회</span><span>남은 가방 ${S.hp}/${S.maxHp}</span><span>최종 덱 ${S.deck.length}장</span></div>
    <button class="btn" id="againBtn">처음부터 다시</button>
  </section>`;
  document.getElementById('againBtn').onclick=()=>{S={screen:'title'};render()};
}
function renderGameover(){
  $app.innerHTML=`<section class="page">
    <h2>가방이 찢어졌어요</h2>
    <p>편지들이 안개 속으로 흩날렸다. 비둘기 선배가 떨어진 편지를 주워 모은다.</p>
    <div class="pline">${PIGEON_SVG}<span>괜찮아, 신입. 나도 첫날엔 가방 세 번 찢어먹었어. 다시 가 보자.</span></div>
    <p class="note">편지 ${S.li+1}번째에서 멈췄어요. 어렵다면 처음 화면에서 '쉬움'을 골라 보세요.</p>
    <button class="btn" id="againBtn">다시 배달하기</button>
  </section>`;
  document.getElementById('againBtn').onclick=()=>{S={screen:'title'};render()};
}

/* ================= 연출 ================= */
function floatAt(id,text,cls){
  const el=document.getElementById(id); if(!el) return;
  const r=el.getBoundingClientRect();
  const f=document.createElement('div'); f.className='float '+cls; f.textContent=text;
  f.style.left=(r.left+r.width/2+(Math.random()*30-15))+'px'; f.style.top=(r.top+r.height*0.3)+'px';
  document.body.appendChild(f); setTimeout(()=>f.remove(),950);
}
function anim(id,cls){
  const el=document.getElementById(id); if(!el) return;
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  setTimeout(()=>el.classList.remove(cls),450);
}
function quip(t){
  const el=document.querySelector('.player'); if(!el) return;
  const q=document.createElement('div'); q.className='quip'; q.textContent='비둘기 선배: '+t; el.appendChild(q); setTimeout(()=>q.remove(),1600);
}

/* ================= 키보드 ================= */
document.addEventListener('keydown',ev=>{
  if(!S) return;
  if(S.screen==='dialog' && (ev.key===' '||ev.key==='Enter')){ ev.preventDefault(); advanceDialog(); return; }
  if(S.screen==='battle'){
    if(/^[1-9]$/.test(ev.key)){ playCard(+ev.key-1); return; }
    if(ev.key==='e'||ev.key==='E'){ endTurn(); return; }
  }
});

/* 테스트와 디버그용 */
window.FOG={get S(){return S}, playCard, endTurn, newRun, CARDS, ENEMIES, render, advanceDialog,
  get busy(){return busy}};

/* ================= 시작 ================= */
window.claude?.hot?.snapshot?.(()=>S && S.screen!=='battle' ? JSON.parse(JSON.stringify({...S,dlg:S.dlg===INTRO?'INTRO':S.dlg===BEFORE_BOSS?'BOSS':null})) : null);
function boot(d){
  if(d && d.screen){ S=d; if(S.dlg==='INTRO') S.dlg=INTRO; else if(S.dlg==='BOSS') S.dlg=BEFORE_BOSS; }
  else S={screen:'title'};
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
